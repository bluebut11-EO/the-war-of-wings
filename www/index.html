const CHEST_LOOT = [{ item: 'berry', n: 2 }, { coins: 40 }, { item: 'cookie', n: 1 }, { item: 'honey', n: 1 }, { item: 'bigberry', n: 1 }, { coins: 60 }];
async function openChest(o){
  if (G.chests[o.id]){ await say([['narr', '빈 상자다.']]); return; }
  G.chests[o.id] = true;
  const idx = Math.floor(hash2(o.x, o.y, o.id.length) * CHEST_LOOT.length);
  const L = CHEST_LOOT[idx]; const ch = (REGIONS[S.map.id] || { ch: 0 }).ch;
  AudioSys.sfx('chest');
  if (L.coins){ const c = L.coins + ch * 15; G.coins += c; await say([['narr', `상자를 열었다! 코인 ${c}개를 찾았다.`]]); }
  else { G.items[L.item] = (G.items[L.item] || 0) + L.n; await say([['narr', `상자를 열었다! ${ITEMS[L.item].name} ${L.n}개를 찾았다.`]]); }
  save();
}

async function hatchEgg(){
  await say([['narr', '무지개빛 알이 따뜻하게 빛나고 있다.'], ['O', '알... 인가? 꼭 숨 쉬는 것 같아.']]);
  AudioSys.sfx('crack'); await sleep(700);
  await say([['narr', '톡, 톡... 알에 금이 가더니, 작은 날개가 쏙 나왔다!'], ['sol', '삐익! ...안녕?'], ['L', '용이야! 진짜 아기 용이야!'], ['O', '아침 해처럼 빛나니까... 솔! 솔이라고 부르자.'], ['sol', '솔! 솔 좋아!']]);
  joinDragon('sol', 1); G.flags.sol = true; AudioSys.sfx('join'); toast('솔이 동료가 되었다!');
  await say([['narr', '그때, 나무 그림자 속에서 검은 박쥐들이 튀어나왔다!'], ['sol', '저 그림자들... 나를 쫓아왔어!'], ['L', '솔, 우리가 같이 있어! 힘내!']]);
  closeDialog();
  for (;;){
    const res = await startBattle({ enemies: [{ kind: 'bat', lv: 1 }, { kind: 'bat', lv: 1 }], canRun: false, tutorial: true, gauge: 60 });
    await fade(false);
    if (res === 'win') break;
    healAll(); await say([['O', '괜찮아, 다시 해 보자! 이번엔 내 힘도 써 봐!']]); closeDialog();
  }
  await say([
    ['sol', '저 그림자는 할로우야. 내가 태어난 곳, 하늘섬 벨로라를 조금씩 먹어 치우고 있어.'],
    ['narr', '언덕 위 오래된 돌문이 환하게 빛나기 시작했다.'],
    ['O', '{L}, 솔을 집에 데려다주자!'],
    ['L', '응! 같이 가자, 솔!'],
  ]);
  G.flags.prologue_done = true; G.spring = { map: 'home', x: 10, y: 14 }; healAll(); save();
  toast('언덕 위 돌문이 열렸다!'); AudioSys.sfx('door');
}

async function bossEncounter(o){
  const rid = S.map.id, R = REGIONS[rid];
  S.bossId = o.id; S.bossCalm = false;
  await say(R.bossPre);
  closeDialog();
  const res = await startBattle({ enemies: [{ kind: o.id, lv: BOSSES[o.id].lv, boss: true }], boss: o.id, canRun: false });
  if (res !== 'win'){ await handleLose(); return; }
  await fade(false);
  S.bossCalm = true;
  if (o.id === 'morg'){ await say(R.bossPost); closeDialog(); return ending(); }
  G.flags['clear_' + rid] = true;
  await say(R.bossPost);
  if (R.partner && !G.party[R.partner]){
    joinDragon(R.partner, Math.max(avgLevel(), BOSSES[o.id].lv - 1));
    AudioSys.sfx('join');
    await say([['narr', `${josa(DRAGONS[R.partner].name, '이', '가')} 동료가 되었다!${G.active.includes(R.partner) ? '' : ' (메뉴의 동료 탭에서 출전시킬 수 있어요)'}`]]);
  }
  G.scales++; G.flags['scale' + G.scales] = true;
  AudioSys.sfx('scale');
  await say([['narr', `${R.scale}을 얻었다! (${G.scales}/5)`]]);
  if (G.scales === 3) await say([['narr', '하준과 하나의 마음이 더 단단해졌다! 새 힘: 든든한 방패, 반짝 피리'], ['L', '{O}, 우리도 강해진 것 같아!']]);
  healAll(); closeDialog(); save();
  S.busy = true;
  await enterMap('hub', R.hubPos[0], R.hubPos[1]);
  S.busy = true; setFieldUI(false);
  AudioSys.sfx('scale');
  await say([['narr', `평화의 등대에 ${G.scales}번째 빛이 켜졌다!`], ['orwin', ORWIN_HINTS[G.scales]]]);
  closeDialog(); S.busy = false; setFieldUI(true);
  toast(G.scales >= 5 ? '공허의 틈으로 가는 문이 열렸다!' : '새 문이 열렸다!');
  G.spring = { map: 'hub', x: 14, y: 6 }; save();
}

async function ending(){
  G.flags.clear_rift = true; G.flags.ended = true;
  await say([
    ['orwin', '보았니? 다섯 부족이 같은 하늘을 날고 있구나. 백 년 만의 일이야.'],
    ['sol', '{L}, {O}... 나 여기 남을래. 다섯 부족을 이어 주는 평화의 용이 될 거야.'],
    ['O', '솔... 정말 보고 싶을 거야.'],
    ['sol', '이 비늘을 가져가. 비늘이 빛나면 언제든 다시 만날 수 있어!'],
    ['L', '약속이야, 솔!'],
  ]);
  closeDialog(); save();
  await fade(true);
  S.mode = 'ending'; setFieldUI(false);
  AudioSys.play('ending');
  const el = $('ending'); el.hidden = false;
  const mins = Math.round(G.time / 60);
  el.innerHTML = `<div class="en">The War of Wings</div>
    <div class="story">${fmt('평화의 등대에 다섯 빛이 켜지고, 백 년 동안 이어진 날개 전쟁이 끝났습니다.<br>모스백, 타이드핀, 엠버클로, 글래스윙, 스톰혼은 이제 평화의 둥지에서 함께 회의를 엽니다.<br><br>{L과/와} {O}의 주머니에는 지금도 따뜻하게 빛나는 비늘 하나가 들어 있습니다.')}</div>
    <div class="stats"><div><b>${mins}분</b><span>모험한 시간</span></div><div><b>${G.stats.wins}번</b><span>이긴 전투</span></div><div><b>Lv ${avgLevel()}</b><span>용들의 평균 레벨</span></div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn gold" id="endHub">평화의 둥지로 돌아가기</button><button class="btn" id="endTitle">처음 화면으로</button></div>
    <div class="foot" style="font-size:12px;color:var(--muted)">기획·제작: Claude와 함께 · 원작 Wings of Fire에서 분위기만 빌려 온 창작 이야기</div>`;
  await fade(false);
  $('endHub').onclick = async () => { el.hidden = true; await enterMap('hub', 9, 11); };
  $('endTitle').onclick = () => { el.hidden = true; showTitle(); };
}

/* ---------- title & new game ---------- */
const titleDragons = [];
function renderTitleBG(dt){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const gr = ctx.createLinearGradient(0, 0, 0, VH);
  gr.addColorStop(0, '#141830'); gr.addColorStop(.55, '#3A2E6E'); gr.addColorStop(.85, '#C8607A'); gr.addColorStop(1, '#FFB547');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);
  for (let i = 0; i < 70; i++){ const x = hash2(i, 1) * VW, y = hash2(i, 2) * VH * .6; ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(S.t * 1.5 + i)); ctx.fillStyle = '#FFF4D6'; ctx.fillRect(x, y, 2, 2); }
  ctx.globalAlpha = 1;
  // far islands
  ctx.fillStyle = 'rgba(20,24,48,.55)';
  for (let i = 0; i < 4; i++){ const x = ((i * 300 + S.t * 6) % (VW + 300)) - 150, y = VH * (.62 + (i % 2) * .08); ctx.beginPath(); ctx.ellipse(x, y, 110, 22, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.moveTo(x - 80, y); ctx.lineTo(x, y + 70); ctx.lineTo(x + 80, y); ctx.fill(); }
  // clouds
  ctx.fillStyle = 'rgba(255,230,210,.18)';
  for (let i = 0; i < 6; i++){ const x = ((i * 220 + S.t * 14) % (VW + 220)) - 110, y = VH * (.72 + (i % 3) * .07); ctx.beginPath(); ctx.arc(x, y, 50, 0, 7); ctx.arc(x + 50, y + 8, 40, 0, 7); ctx.arc(x - 46, y + 10, 36, 0, 7); ctx.fill(); }
  // flying clan dragons
  if (!titleDragons.length) ['sprig', 'ripple', 'kindle', 'glint', 'jolt'].forEach((k, i) => titleDragons.push({ k, x: -100 - i * 260, y: .2 + (i % 3) * .1, s: .07 + (i % 2) * .02, sp: 40 + i * 8 }));
  for (const d of titleDragons){ d.x += d.sp * dt; if (d.x > VW + 120) d.x = -140; drawDragon(ctx, d.x, VH * d.y + Math.sin(S.t + d.x * .01) * 10, Math.min(VW, VH) * d.s, LOOKS[d.k], S.t * 1.4, { face: 1, fast: true }); }
  drawDragon(ctx, VW / 2 + Math.sin(S.t * .7) * 30, VH * .44 + Math.sin(S.t * 1.3) * 12, Math.min(VW * .34, VH * .2), LOOKS.sol, S.t, { face: 1, fast: true });
}
function showTitle(){
  S.mode = 'title'; S.busy = false; G = null;
  setFieldUI(false); ['bui', 'dlg', 'menu', 'shop', 'choose', 'ending'].forEach(id => $(id).hidden = true);
  $('title').hidden = false;
  $('contBtn').hidden = !loadSave();
  $('titleSound').textContent = AudioSys.ctx && AudioSys.musicOn ? '소리 끄기' : '소리 켜기';
  AudioSys.play('title');
}
$('titleSound').onclick = () => {
  const wasOn = !!(AudioSys.ctx && AudioSys.musicOn && AudioSys.sfxOn && AudioSys.cur);
  AudioSys.init();
  const on = !wasOn;
  AudioSys.setMusic(on); AudioSys.setSfx(on);
  if (on){ AudioSys.play('title'); AudioSys.sfx('confirm'); }
  $('titleSound').textContent = on ? '소리 끄기' : '소리 켜기';
};
$('newBtn').onclick = () => { AudioSys.init(); AudioSys.sfx('confirm'); chooseLeader(); };
$('contBtn').onclick = async () => {
  AudioSys.init(); AudioSys.sfx('confirm');
  const sv = loadSave(); if (!sv) return;
  G = sv; $('title').hidden = true;
  await enterMap(G.map, G.x, G.y);
};
function chooseLeader(){
  $('title').hidden = true; S.mode = 'choose';
  const el = $('choose'); el.hidden = false; el.innerHTML = '';
  let leader = 'hajun', diff = 'normal';
  const stepLeader = () => {
    el.innerHTML = '<h2>누가 모험을 이끌까요?</h2><p class="sub">이끄는 아이의 힘은 조금 더 빨리 쓸 수 있어요. 둘 다 함께 모험해요.</p>';
    const cards = document.createElement('div'); cards.className = 'cards';
    for (const k of ['hajun', 'hana']){
      const c = document.createElement('button'); c.className = 'card' + (leader === k ? ' sel' : '');
      const cvs = document.createElement('canvas'); cvs.width = cvs.height = 220; drawPortrait(cvs, { kid: k, mood: 'happy' });
      c.appendChild(cvs);
      const sk = KID_SKILLS[k];
      c.insertAdjacentHTML('beforeend', `<b>${KIDS[k].name} · ${KO[k]}</b><span>${k === 'hajun' ? '겁이 없고 먼저 뛰어드는 아이' : '동물과 금방 친해지는 아이'}<br>힘: ${sk[0].n}</span>`);
      c.onclick = () => { leader = k; AudioSys.sfx('select'); stepLeader(); };
      cards.appendChild(c);
    }
    el.appendChild(cards);
    const nx = document.createElement('button'); nx.className = 'btn gold'; nx.textContent = '다음'; nx.style.width = 'min(320px,100%)';
    nx.onclick = () => { AudioSys.sfx('confirm'); stepDiff(); }; el.appendChild(nx);
    const bk = document.createElement('button'); bk.className = 'btn'; bk.textContent = '처음 화면'; bk.style.width = 'min(320px,100%)'; bk.onclick = () => { el.hidden = true; showTitle(); }; el.appendChild(bk);
  };
  const stepDiff = () => {
    el.innerHTML = '<h2>난이도를 골라요</h2><p class="sub">모험 중에도 메뉴의 설정에서 바꿀 수 있어요.</p>';
    const cards = document.createElement('div'); cards.className = 'cards';
    for (const k of Object.keys(DIFF)){
      const d = DIFF[k];
      const c = document.createElement('button'); c.className = 'card' + (diff === k ? ' sel' : '');
      const cvs = document.createElement('canvas'); cvs.width = cvs.height = 220;
      const g = cvs.getContext('2d'); g.fillStyle = '#232A52'; g.fillRect(0, 0, 220, 220);
      drawDragon(g, 120, 130, k === 'easy' ? 60 : k === 'normal' ? 75 : 90, LOOKS[k === 'easy' ? 'sol' : k === 'normal' ? 'ripple' : 'jolt'], 1, { face: 1, still: true });
      c.appendChild(cvs);
      c.insertAdjacentHTML('beforeend', `<b>${d.name}</b><span>${d.sub}<br>${d.desc}</span>`);
      c.onclick = () => { diff = k; AudioSys.sfx('select'); stepDiff(); };
      cards.appendChild(c);
    }
    el.appendChild(cards);
    const go = document.createElement('button'); go.className = 'btn gold'; go.textContent = '모험 시작!'; go.style.width = 'min(320px,100%)';
    go.onclick = () => { AudioSys.sfx('confirm'); el.hidden = true; newGame(leader, diff); }; el.appendChild(go);
    const bk = document.createElement('button'); bk.className = 'btn'; bk.textContent = '뒤로'; bk.style.width = 'min(320px,100%)'; bk.onclick = () => { AudioSys.sfx('cancel'); stepLeader(); }; el.appendChild(bk);
  };
  stepLeader();
}
async function newGame(leader, diff){
  G = newState(leader, diff);
  ['title', 'choose'].forEach(id => $(id).hidden = true);
  for (const k in MAPS) delete MAPS[k];
  await enterMap('home', 10, 14);
}

/* ---------- main loop ---------- */
let lastT = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; S.t += dt;
  try {
    if (S.mode === 'field' && S.map){ if (G) G.time += dt; updateField(dt); renderField(); }
    else if (S.mode === 'battle'){ if (G) G.time += dt; renderBattle(dt); }
    else renderTitleBG(dt);
  } catch (err){ console.error(err); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (AudioSys.ctx){ if (document.hidden) AudioSys.ctx.suspend().catch(() => {}); else AudioSys.ctx.resume().catch(() => {}); } });

/* ---------- test hooks (automated play on Linux) ---------- */
window.__wow = {
  get G(){ return G; }, get B(){ return B; }, get S(){ return S; }, MAPS, getMap, REGIONS, BOSSES,
  fast(on){ TIME.fast = on; S.autoDialog = on; S.autoBattle = on; },
  newGame, enterMap, interact, randomBattle, bossEncounter, startBattle, avgLevel, owned, statsFor,
  async interactAt(x, y){ const o = objAt(S.map, x, y); if (o) await interact(o); return !!o; },
  async boss(){ const o = S.map.objs.find(o => o.type === 'boss'); if (o) await bossEncounter(o); },
  icon(c, mask){ const x = c.getContext('2d'), N = c.width; x.save(); const gr = x.createRadialGradient(N * .5, N * .42, N * .05, N * .5, N * .5, N * .75); gr.addColorStop(0, '#3A4A9A'); gr.addColorStop(1, '#141A33'); x.fillStyle = gr; x.fillRect(0, 0, N, N);
    for (let i = 0; i < 40; i++){ x.fillStyle = `rgba(255,255,255,${.3 + (i % 5) * .12})`; x.beginPath(); x.arc((i * 137.5 % 100) / 100 * N, (i * 61.8 % 100) / 100 * N, N * .004 * (1 + i % 3), 0, 7); x.fill(); }
    x.fillStyle = 'rgba(255,214,120,.25)'; x.beginPath(); x.arc(N * .5, N * .5, N * (mask ? .3 : .38), 0, 7); x.fill();
    drawDragon(x, N * .53, N * .58, N * (mask ? .38 : .5), LOOKS.sol, 1.2, { face: 1, still: false }); x.restore(); },
};

resize();
showTitle();
requestAnimationFrame(frame);

Clips.setOk(() => !!(AudioSys.ctx && AudioSys.sfxOn));

})();
</script>
