<style>
/* Layout: one full-bleed storybook canvas; every control is a night-blue glass panel edged in dawn gold */
:root{
  --night: rgba(20,24,48,.93); --night-solid:#141830; --edge:#3B4A8C; --ink:#F4EFE2; --muted:#A9B2D6;
  --dawn:#FFB547; --dawn-deep:#D9861C; --coral:#FF6B57; --sky:#7FD3FF; --leaf:#7DDB6A;
  --f-title:"Cinzel","Times New Roman",serif;
  --f-story:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --f-ui:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night-solid);color:var(--ink);font-family:var(--f-ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--dawn);outline-offset:2px}
.panel{background:var(--night);border:2px solid var(--edge);border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:14px;
  background:#28305C;border:2px solid var(--edge);box-shadow:0 4px 0 #0C0F22;font-size:18px;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0C0F22}
.btn.gold{background:var(--dawn);color:#3A2200;border-color:#FFD58C;box-shadow:0 5px 0 var(--dawn-deep)}
.btn.gold:active{box-shadow:0 1px 0 var(--dawn-deep)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn small{font-size:12px;color:var(--muted)}

/* ---------- title ---------- */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding-block:24px 40px}
#title .logo{text-align:center;margin-bottom:auto;margin-top:12vh;text-shadow:0 4px 18px rgba(0,0,0,.6)}
#title .logo .en{font-family:var(--f-title);font-weight:800;font-size:clamp(36px,9vw,72px);letter-spacing:.06em;line-height:1;
  background:linear-gradient(180deg,#FFF4D6 0%,#FFB547 60%,#D9861C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#title .logo .ko{font-family:var(--f-story);font-weight:700;font-size:20px;letter-spacing:.5em;margin-top:10px;color:#FFE9B8}
#title .menu{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
#title .foot{font-size:12px;color:var(--muted);text-align:center}

/* ---------- choose screens ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:28px;background:rgba(10,12,28,.72)}
.screen h2{font-family:var(--f-story);font-weight:700;font-size:24px;margin:0;text-align:center;text-wrap:balance}
.screen p.sub{margin:0;color:var(--muted);font-size:15px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:min(560px,100%)}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px 16px;border-radius:16px;background:#1E2446;border:2px solid var(--edge);text-align:center}
.card.sel{border-color:var(--dawn);box-shadow:0 0 0 3px rgba(255,181,71,.35)}
.card canvas{width:110px;height:110px}
.card b{font-size:20px;font-weight:400}
.card span{font-size:13px;color:var(--muted);line-height:1.45}

/* ---------- field HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding-block:10px;pointer-events:none}
#hud .loc{pointer-events:none;padding:6px 12px;border-radius:12px;background:var(--night);border:2px solid var(--edge);font-size:15px}
#hud .scales{display:flex;gap:4px;padding:8px 10px;border-radius:12px;background:var(--night);border:2px solid var(--edge)}
#hud .scales i{width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:#3A4270;display:block}
#hud .spacer{flex:1}
#menuBtn{pointer-events:auto;width:46px;height:46px;border-radius:12px;background:var(--night);border:2px solid var(--edge);display:grid;place-items:center}
#menuBtn svg{width:22px;height:22px}
#pad{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:18px;width:156px;height:156px;touch-action:none}
#pad button{position:absolute;width:52px;height:52px;border-radius:14px;background:rgba(20,24,48,.72);border:2px solid rgba(127,140,214,.6);display:grid;place-items:center}
#pad button:active,#pad button.on{background:rgba(255,181,71,.55)}
#pad svg{width:22px;height:22px}
#pad .u{left:52px;top:0} #pad .d{left:52px;bottom:0} #pad .l{left:0;top:52px} #pad .r{right:0;top:52px}
#aBtn{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:44px;width:78px;height:78px;border-radius:50%;
  background:rgba(255,181,71,.85);border:3px solid #FFE0A8;color:#3A2200;font-size:20px;box-shadow:0 5px 0 var(--dawn-deep)}
#aBtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--dawn-deep)}

/* ---------- dialogue ---------- */
#dlg{position:absolute;left:0;right:0;bottom:0;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px))}
#dlg .box{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start;padding:12px 14px 14px;max-width:760px;margin:0 auto;min-height:112px}
#dlg .box.noPortrait{grid-template-columns:1fr}
#dlg canvas{width:76px;height:76px;border-radius:12px;background:#232A52}
#dlg .name{font-size:15px;color:var(--dawn);margin-bottom:4px}
#dlg .text{font-family:var(--f-story);font-size:18px;line-height:1.6;min-height:58px;word-break:keep-all}
#dlg .more{position:absolute;right:28px;bottom:22px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid var(--dawn);animation:bob .7s infinite alternate}
@keyframes bob{to{transform:translateY(4px)}}
#dlg .choices{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

/* ---------- toast ---------- */
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:var(--night);border:2px solid var(--dawn);
  font-size:16px;text-align:center;max-width:calc(100% - 40px);pointer-events:none;transition:opacity .3s}

/* ---------- menus ---------- */
#menu,#shop{position:absolute;inset:0;background:rgba(8,10,24,.7);display:flex;align-items:flex-end;justify-content:center}
#menu .sheet,#shop .sheet{width:min(720px,100%);max-height:88%;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0;border-bottom:0}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{padding:8px 14px;border-radius:999px;background:#232A52;border:2px solid var(--edge);font-size:15px}
.tabs button.on{background:var(--dawn);color:#3A2200;border-color:#FFD58C}
.tabs .close{margin-left:auto}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:#1E2446;border:2px solid #2C3566}
.row canvas{width:56px;height:56px;border-radius:10px;background:#232A52}
.row .t{font-size:17px}
.row .s{font-size:13px;color:var(--muted);line-height:1.45}
.row .bar{height:8px;border-radius:99px;background:#0E1128;overflow:hidden;margin-top:4px}
.row .bar i{display:block;height:100%;background:var(--leaf)}
.row.active{border-color:var(--dawn)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#2C3566;color:var(--ink);margin-right:4px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:14px;background:#1E2446;border:2px solid #2C3566}
.coins{font-size:16px;color:var(--dawn)}

/* ---------- battle UI ---------- */
#bui{position:absolute;left:0;right:0;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(180deg,rgba(14,17,38,0) 0%,rgba(14,17,38,.92) 22%)}
#bui .inner{width:min(760px,100%);margin:0 auto;display:flex;flex-direction:column;gap:8px}
#blog{min-height:26px;font-family:var(--f-story);font-size:16px;text-align:center;padding:4px 10px;word-break:keep-all}
#allies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ally{padding:6px 8px;border-radius:12px;background:#1E2446;border:2px solid #2C3566;min-width:0}
.ally.turn{border-color:var(--dawn);box-shadow:0 0 0 2px rgba(255,181,71,.3)}
.ally.down{opacity:.45}
.ally .n{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ally .hp{height:8px;border-radius:99px;background:#0E1128;overflow:hidden;margin:4px 0 2px}
.ally .hp i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.ally .nums{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ally .ep{color:var(--dawn);letter-spacing:1px}
#cmds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#cmds .btn{min-height:46px;font-size:16px;padding:6px 8px}
#cmds .btn .el{display:inline-block;width:10px;height:10px;border-radius:50%}
#kids{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:stretch}
.kid{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center;padding:6px 8px;border-radius:12px;background:#1E2446;border:2px solid #2C3566;text-align:left;min-height:52px}
.kid canvas{width:40px;height:40px;border-radius:8px;background:#232A52}
.kid .k1{font-size:14px}
.kid .k2{font-size:11px;color:var(--muted)}
.kid .g{height:6px;border-radius:99px;background:#0E1128;overflow:hidden;margin-top:3px}
.kid .g i{display:block;height:100%;background:linear-gradient(90deg,#FFB547,#FF6B57)}
.kid.ready{border-color:var(--dawn);animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 14px rgba(255,181,71,.6)}}
.kid[disabled]{opacity:.55}

#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
#ending{position:absolute;inset:0;overflow-y:auto;background:radial-gradient(ellipse at 50% 30%,#3A2E6E 0%,#141830 70%);display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:40px}
#ending .en{font-family:var(--f-title);font-weight:800;font-size:clamp(30px,7vw,56px);color:#FFE9B8;text-align:center}
#ending .story{font-family:var(--f-story);font-size:17px;line-height:1.8;max-width:34em;text-align:center;word-break:keep-all}
#ending .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(460px,100%)}
#ending .stats div{padding:10px;border-radius:14px;background:#1E2446;border:2px solid var(--edge);text-align:center}
#ending .stats b{display:block;font-size:22px;font-weight:400;color:var(--dawn)}
#ending .stats span{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

#title{isolation:isolate}

#title{isolation:isolate}

#title{isolation:isolate}

/* ---------- title art & motion (Higgsfield) ---------- */
#titleMedia{position:absolute; inset:0; z-index:-1; pointer-events:none!important; overflow:hidden; opacity:0; transition:opacity .7s; background:#000}
#titleMedia.ready{opacity:1}
#titleMedia img, #titleMedia video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
#titleMedia .blur{filter:blur(28px) brightness(.7); transform:scale(1.15); display:none}
#titleMedia video{opacity:0; transition:opacity .9s}
#titleMedia.moving video{opacity:1}
#titleMedia .shade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,6,20,.5) 0%, rgba(10,6,20,0) 32%, rgba(10,6,20,0) 55%, rgba(10,6,20,.82) 100%)}
@media (min-aspect-ratio: 4/5){ #titleMedia .blur{display:block} #titleMedia .main, #titleMedia video{object-fit:contain} }
#title{isolation:isolate}
</style>

<script>
(() => {
/* Title art & motion: local media/ copy first, online copy second, drawn title if both fail. */
(function titleMedia(){
  const HOOKS = { ok: () => !!(AudioSys.ctx && AudioSys.sfxOn && AudioSys.musicOn), duck: () => {}, voice: () => Clips.play('title', { force: true }) };
  const box = document.getElementById('titleMedia'); if (!box) return;
  const host = box.parentElement, imgs = box.querySelectorAll('img'), main = box.querySelector('.main'), blur = box.querySelector('.blur'), vid = box.querySelector('video');
  const IMG = JSON.parse(box.dataset.img || '[]'), VID = JSON.parse(box.dataset.vid || '[]');
  let i = 0;
  main.onload = () => { blur.src = main.currentSrc || main.src; box.classList.add('ready'); };
  main.onerror = () => { if (++i < IMG.length) main.src = IMG[i]; };
  if (IMG.length) main.src = IMG[0];
  const calm = (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || (navigator.connection && navigator.connection.saveData);
  if (!VID.length || calm) vid.remove();
  vid.muted = true; vid.defaultMuted = true; vid.playsInline = true; vid.loop = true; vid.setAttribute('muted', '');
  let v = 0;
  const hasVid = () => vid.isConnected;
  const shown = () => !host.hidden && !host.closest('[hidden]');
  const play = () => { if (shown() && vid.isConnected) { const p = vid.play(); if (p && p.catch) p.catch(() => {}); } };
  const load = () => { vid.src = VID[v]; vid.load(); };
  if (hasVid()) vid.addEventListener('error', () => { if (++v < VID.length) load(); else vid.remove(); });
  if (hasVid()) vid.addEventListener('playing', () => { box.classList.add('moving', 'ready'); });
  if (hasVid()) vid.addEventListener('canplay', play);
  new MutationObserver(() => { if (shown()) play(); else vid.pause(); }).observe(host, { attributes: true, attributeFilter: ['hidden'] });
  document.addEventListener('pointerdown', play, { capture: true, passive: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden) vid.pause(); else play(); });
  // Play the clip's spoken line once, after the first tap on the title screen (only when game sound is on).
  let voiced = false;
  const voice = () => {
    if (voiced || !shown()) return;
    let ok = true; try { ok = HOOKS.ok(); } catch (e) {}
    if (!ok) return;
    if (HOOKS.voice){ voiced = true; try { HOOKS.voice(); } catch (e) {} return; }
    if (!vid.isConnected || vid.readyState < 2) return;
    voiced = true; vid.currentTime = 0; vid.muted = false; vid.volume = 1; play();
    try { HOOKS.duck(true); } catch (e) {}
    let last = 0;
    const done = () => { vid.muted = true; vid.removeEventListener('timeupdate', tick); vid.removeEventListener('pause', done); try { HOOKS.duck(false); } catch (e) {} };
    const tick = () => { if (vid.currentTime + .3 < last) done(); last = vid.currentTime; };
    vid.addEventListener('timeupdate', tick); vid.addEventListener('pause', done);
  };
  document.addEventListener('click', () => setTimeout(voice, 60));
  if (hasVid()) load();
})();

/* Character voice lines made with Higgsfield (ElevenLabs v4 voices). */
const Clips = (() => {
  const LIB = {"title": [{"l": "media/voice/title1.mp3", "r": "https://d8j0ntlcm91z4.cloudfront.net/user_3KkGGOriAdCX1K3K6BvMto6W8aM/hf_20261016_194142_8d4513f5-c021-462f-a7c7-b8dd83c6646f.mp3"}], "ok": [{"l": "media/voice/ok1.mp3", "r": "https://d8j0ntlcm91z4.cloudfront.net/user_3KkGGOriAdCX1K3K6BvMto6W8aM/hf_20261016_194151_c8301791-7342-4c20-b340-49e26fe10d94.mp3"}], "go": [{"l": "media/voice/go1.mp3", "r": "https://d8j0ntlcm91z4.cloudfront.net/user_3KkGGOriAdCX1K3K6BvMto6W8aM/hf_20261016_194151_33088f66-650b-488d-a087-23a573dd33ad.mp3"}], "no": [{"l": "media/voice/no1.mp3", "r": "https://d8j0ntlcm91z4.cloudfront.net/user_3KkGGOriAdCX1K3K6BvMto6W8aM/hf_20261016_194151_c751ccee-238b-4859-951c-c619f38f5b77.mp3"}], "win": [{"l": "media/voice/win1.mp3", "r": "https://d8j0ntlcm91z4.cloudfront.net/user_3KkGGOriAdCX1K3K6BvMto6W8aM/hf_20261016_194152_464b16d9-ef61-4d87-bdb3-8bdb7dc906bd.mp3"}]};
  const cache = {}; let cur = null, last = 0, okFn = () => true;

const NOTE_IDX = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
function noteToMidi(tok){
  const m = /^([A-G])(#|b)?(-?\d)$/.exec(tok); if (!m) return null;
  let n = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return n + (parseInt(m[3], 10) + 1) * 12;
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function parseLine(str){
  // one token per step; '-' holds previous note, '.' rest, '|' ignored
  const toks = str.split(/\s+/).filter(t => t && t !== '|');
  const ev = []; let cur = null;
  toks.forEach((t, i) => {
    if (t === '-'){ if (cur) cur.len++; return; }
    cur = null;
    if (t === '.') return;
    const m = noteToMidi(t); if (m == null) return;
    cur = { step: i, midi: m, len: 1 }; ev.push(cur);
  });
  return { ev, steps: toks.length };
}
function chordNotes(name){
  const m = /^([A-G])(#|b)?(m|dim|sus)?$/.exec(name); if (!m) return [];
  let r = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 60;
  if (r > 66) r -= 12;
  const q = m[3];
  const third = q === 'm' || q === 'dim' ? 3 : q === 'sus' ? 5 : 4;
  const fifth = q === 'dim' ? 6 : 7;
  return [r, r + third, r + fifth];
}

}

  const k = boss ? BOSSES[kind] : ENEMIES[kind];
  return {
    maxhp: Math.round((22 + 8.5 * (lv - 1)) * k.hp),
    atk: Math.round((9 + 2.4 * (lv - 1)) * k.atk),
    def: Math.round((5 + 1.6 * (lv - 1)) * k.def),
    spd: Math.round((7 + 1.1 * (lv - 1)) * k.spd),
  };
}

/* ---------- region generator ---------- */
function generateRegion(id){
  const R = REGIONS[id];
  for (let attempt = 0; attempt < 60; attempt++){
    const m = tryGenerate(id, R, R.seed + attempt * 7919);
    if (m) return m;
  }
  throw new Error('map generation failed: ' + id);
}
function tryGenerate(id, R, seed){
  const rnd = mulberry32(seed), ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));

  const g = []; for (let y = 0; y < H; y++) g.push(new Array(W).fill('#'));
  const inb = (x, y) => x > 0 && y > 0 && x < W - 1 && y < H - 1;

  const center = new Set(), key = (x, y) => x + ',' + y;

  let cx = 11, y = H - 2;
  const pathPts = [];

    for (let dx = -1; dx <= 1; dx++) carve(cx + dx, y);
    center.add(key(cx, y)); pathPts.push([cx, y]);
    if (y < H - 4 && y > 5 && rnd() < .32){
      const nx = clamp(cx + ri(-4, 4), 3, W - 4);
      const step = nx > cx ? 1 : -1;
      while (cx !== nx){ cx += step; for (let dy = -1; dy <= 1; dy++) carve(cx, y + dy); center.add(key(cx, y)); pathPts.push([cx, y]); }
    }
    y--;

  const topX = cx;

  for (let yy = 1; yy <= 5; yy++) for (let xx = topX - 4; xx <= topX + 4; xx++) if (((xx - topX) / 4.5) ** 2 + ((yy - 3.2) / 2.4) ** 2 <= 1) carve(xx, yy);
  for (let yy = H - 4; yy <= H - 2; yy++) for (let xx = 8; xx <= 14; xx++) carve(xx, yy);
  // side rooms
  const rooms = [];
  const nRooms = ri(5, 7);
  for (let r = 0; r < nRooms; r++){
    const p = pathPts[ri(Math.floor(pathPts.length * .1), Math.floor(pathPts.length * .85))];
    const side = rnd() < .5 ? -1 : 1, off = ri(4, 7);
    const rx = clamp(p[0] + side * off, 3, W - 4), ry = clamp(p[1] + ri(-2, 2), 6, H - 6);
    const rr = ri(2, 3);
    for (let yy = ry - rr; yy <= ry + rr; yy++) for (let xx = rx - rr - 1; xx <= rx + rr + 1; xx++) if (((xx - rx) / (rr + .8)) ** 2 + ((yy - ry) / (rr + .3)) ** 2 <= 1) carve(xx, yy);
    const a = Math.min(rx, p[0]), b = Math.max(rx, p[0]);
    for (let xx = a; xx <= b; xx++){ carve(xx, ry); carve(xx, ry + 1); }
    for (let yy = Math.min(ry, p[1]); yy <= Math.max(ry, p[1]); yy++) carve(p[0], yy);

  }

  const bossPos = [topX, 2]; g[2][topX] = '.';
  const objs = [];
  const exitPos = [11, H - 1]; g[H - 1][11] = 'E';
  // springs: mid path and near boss

  const nearBoss = pathPts[pathPts.length - 3] || [topX, 6];

  }
  // path + decor
  for (const k of center){ const [xx, yy] = k.split(',').map(Number); if (g[yy][xx] === '.' && rnd() < .85) g[yy][xx] = '='; }
  for (let yy = 1; yy < H - 1; yy++) for (let xx = 1; xx < W - 1; xx++) if (g[yy][xx] === '.' && rnd() < .05) g[yy][xx] = '*';
  // objects list
  springs.forEach(p => objs.push({ type: 'spring', x: p[0], y: p[1] }));
  chests.forEach((p, i) => objs.push({ type: 'chest', x: p[0], y: p[1], id: id + '_c' + i }));
  objs.push({ type: 'boss', x: bossPos[0], y: bossPos[1], id: R.boss });
  if (vPt) objs.push({ type: 'npc', x: vPt[0], y: vPt[1], id: 'villager' });
  if (pPt) objs.push({ type: 'npc', x: pPt[0], y: pPt[1], id: R.partner ? 'partner' : 'orwin' });
  return { id, theme: R.theme, w: W, h: H, rows: g.map(r => r.join('')), objs, start, exits: [{ x: exitPos[0], y: exitPos[1], to: 'hub', tx: R.hubPos[0], ty: R.hubPos[1] }], enc: R.enc, region: id };
}

function buildStatic(){
  const home = { id: 'home', theme: 'home', w: 20, h: 16, rows: HOME_ROWS.slice(), start: [10, 14],
    objs: [{ type: 'egg', x: 8, y: 3 }, { type: 'chest', x: 18, y: 4, id: 'home_c0' }],
    exits: [{ x: 15, y: 1, to: 'hub', tx: 9, ty: 15, req: 'prologue_done', locked: '오래된 돌문이 굳게 닫혀 있다.' }],
    enc: { pool: ['bat'], lv: [1, 2], rate: .08, req: 'sol' } };
  const hub = { id: 'hub', theme: 'hub', w: 20, h: 18, rows: HUB_ROWS.slice(), start: [9, 15],
    objs: [{ type: 'beacon', x: 9, y: 9 }, { type: 'npc', x: 9, y: 7, id: 'orwin' }, { type: 'npc', x: 5, y: 5, id: 'toby' }, { type: 'spring', x: 14, y: 5 }],
    exits: [], enc: null };
  REGION_ORDER.forEach((rid, i) => {
    const R = REGIONS[rid];
    const req = i === 0 ? 'hub_intro' : 'scale' + i;
    hub.exits.push({ x: R.gate[0], y: R.gate[1], to: rid, req, locked: i === 0 ? '오르윈과 먼저 이야기해 보자.' : '빛의 장막이 막고 있다. 비늘을 ' + i + '개 모으면 열린다.' });
  });
  return { home, hub };
}

const MAPS = {};
function getMap(id){
  if (MAPS[id]) return MAPS[id];
  const st = buildStatic();
  MAPS.home = st.home; MAPS.hub = st.hub;
  if (!MAPS[id]) MAPS[id] = generateRegion(id);
  return MAPS[id];
}

function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0){ r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return '#' + ((1 << 24) + (Math.round(r) << 16) + (Math.round(g) << 8) + Math.round(b)).toString(16).slice(1);
}
const DAWN = ['#5DBB4C', '#36B7E8', '#FF7A3D', '#B48CFF', '#FFD23F'];

/* ---------- dragon (side view, 100-unit box, facing right) ---------- */
function drawDragon(ctx, cx, cy, size, L, t, o = {}){
  const face = o.face || 1, flap = Math.sin(t * (o.fast ? 9 : 4.5)) * (o.still ? 0 : 1), bob = Math.sin(t * 2.2) * 2;
  const elder = L.feat === 'elder' || o.elder, young = !elder && !o.big;
  ctx.save();
  ctx.translate(cx, cy + bob * size / 100);
  ctx.scale(face * size / 100, size / 100);
  if (o.aura){
    const gr = ctx.createRadialGradient(0, 0, 10, 0, 0, 95);
    gr.addColorStop(0, o.aura); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, 95, 0, 7); ctx.fill();
  }
  // ground shadow
  ctx.fillStyle = 'rgba(10,10,30,.22)'; ctx.beginPath(); ctx.ellipse(0, 44 - bob, 46, 8, 0, 0, 7); ctx.fill();
  const body = L.body, dark = shade(body, -.28), belly = L.belly;
  // far wing
  drawWing(ctx, L, flap, true, t);
  // tail
  const sway = Math.sin(t * 2) * 6;
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(-24, -2);
  ctx.bezierCurveTo(-50, -2, -62, -16 + sway, -86, -22 + sway);
  ctx.bezierCurveTo(-70, -6 + sway, -54, 18, -22, 20);
  ctx.closePath(); ctx.fill();
  tailTip(ctx, L, -86, -22 + sway, t);
  // back leg
  ctx.fillStyle = dark;
  roundRectPath(ctx, -26, 12, 14, 30, 6); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-17, 41, 10, 5, 0, 0, 7); ctx.fill();
  // body
  ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, 8, 34, 23, 0, 0, 7); ctx.fill();
  ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(6, 17, 25, 12, -.08, 0, 7); ctx.fill();
  // belly stripes
  ctx.strokeStyle = shade(belly, -.12); ctx.lineWidth = 1.6;
  for (let i = -2; i <= 2; i++){ ctx.beginPath(); ctx.moveTo(6 + i * 8, 7); ctx.quadraticCurveTo(8 + i * 8, 17, 6 + i * 8, 27); ctx.stroke(); }
  // spines / features along back
  backFeature(ctx, L, t);
  // neck
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.moveTo(12, -8); ctx.quadraticCurveTo(28, -18, 34, -34); ctx.lineTo(48, -26); ctx.quadraticCurveTo(38, -4, 26, 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = belly; ctx.beginPath(); ctx.moveTo(24, 8); ctx.quadraticCurveTo(36, -6, 44, -24); ctx.lineTo(48, -22); ctx.quadraticCurveTo(40, 0, 28, 12); ctx.closePath(); ctx.fill();
  // head
  const hs = young ? 1.12 : 1;
  ctx.save(); ctx.translate(44, -34); ctx.scale(hs, hs);
  ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, 0, 16, 13, -.1, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14, 4, 13, 8.5, .08, 0, 7); ctx.fill();
  ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(15, 9, 10, 3.6, .08, 0, 7); ctx.fill();
  // horns
  ctx.fillStyle = L.horn;
  const hl = elder ? 1.5 : 1;
  ctx.beginPath(); ctx.moveTo(-8, -8); ctx.quadraticCurveTo(-18, -16 * hl, -24, -24 * hl); ctx.quadraticCurveTo(-12, -16, -2, -11); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-2, -11); ctx.quadraticCurveTo(-8, -20 * hl, -10, -28 * hl); ctx.quadraticCurveTo(0, -18, 4, -12); ctx.closePath(); ctx.fill();
  if (L.feat === 'bolt'){ ctx.strokeStyle = L.horn; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(-12, -22); ctx.lineTo(-6, -22); ctx.lineTo(-14, -34); ctx.stroke(); }
  if (L.feat === 'leaf'){ ctx.fillStyle = '#8FD47A'; leaf(ctx, -10, -16, 9, -2.2); }
  if (L.feat === 'fin'){ ctx.fillStyle = L.mem; ctx.beginPath(); ctx.moveTo(-14, -4); ctx.lineTo(-26, -10); ctx.lineTo(-22, 2); ctx.closePath(); ctx.fill(); }
  if (L.feat === 'dawn'){ ctx.fillStyle = '#FFF4D6'; star(ctx, 2, -6, 3.5); }
  if (elder){ ctx.strokeStyle = shade(L.horn, -.1); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(10, 10); ctx.quadraticCurveTo(8, 20, 2, 24); ctx.stroke(); }
  // eye
  if (o.evil){ ctx.fillStyle = L.eye; ctx.shadowColor = L.eye; ctx.shadowBlur = 10; ctx.beginPath(); ctx.ellipse(3, -3, 5, 3.4, -.2, 0, 7); ctx.fill(); ctx.shadowBlur = 0; }
  else {

    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(3, -3, 5.2, blink ? .8 : 5.4, 0, 0, 7); ctx.fill();
    if (!blink){ ctx.fillStyle = L.eye; ctx.beginPath(); ctx.arc(4.6, -2.6, 3, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5.6, -4, 1.1, 0, 7); ctx.fill(); }
  }
  if (o.glasses){ ctx.strokeStyle = '#2B2F3A'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(4, -3, 6.5, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-2, -4); ctx.lineTo(-10, -6); ctx.stroke(); }
  // nostril + smile
  ctx.fillStyle = shade(body, -.4); ctx.beginPath(); ctx.arc(24, 1, 1.3, 0, 7); ctx.fill();
  ctx.strokeStyle = shade(body, -.4); ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(12, 8); ctx.quadraticCurveTo(18, 10, 24, 7); ctx.stroke();
  if (L.feat === 'flame' && !o.still){ ctx.globalAlpha = .55 + .3 * Math.sin(t * 12); ctx.fillStyle = '#FFB02E'; ctx.beginPath(); ctx.arc(28, 5, 2.4, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
  ctx.restore();
  // front leg
  ctx.fillStyle = body;
  roundRectPath(ctx, 12, 14, 13, 28, 6); ctx.fill();
  ctx.fillStyle = dark; ctx.beginPath(); ctx.ellipse(21, 41, 10, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = L.horn; for (let i = 0; i < 3; i++){ ctx.beginPath(); ctx.arc(25 + i * 3.5 - 4, 44, 1.4, 0, 7); ctx.fill(); }
  // near wing
  drawWing(ctx, L, flap, false, t);
  if (L.feat === 'shadow'){
    ctx.globalAlpha = .35;
    for (let i = 0; i < 5; i++){ ctx.fillStyle = i % 2 ? '#4B2E73' : '#160F24'; ctx.beginPath(); ctx.arc(-40 + i * 20 + Math.sin(t * 2 + i) * 6, 30 + Math.cos(t * 1.6 + i) * 4, 12, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawWing(ctx, L, flap, far, t){
  ctx.save();
  ctx.translate(far ? -4 : 2, -10);
  ctx.rotate((far ? -.18 : 0) + flap * .32);
  const s = far ? .9 : 1;
  ctx.scale(s, s);
  const bone = far ? shade(L.wing, -.25) : L.wing;
  let mem;
  if (L.mem === 'dawn'){
    mem = ctx.createLinearGradient(-30, -60, 50, -10);
    DAWN.forEach((c, i) => mem.addColorStop(i / 4, c));
  } else if (L.mem === 'glass'){
    mem = ctx.createLinearGradient(-20, -70, 40, 0);
    mem.addColorStop(0, 'rgba(240,230,255,.75)'); mem.addColorStop(.5, 'rgba(180,140,255,.55)'); mem.addColorStop(1, 'rgba(120,200,255,.6)');
  } else mem = L.mem;
  ctx.globalAlpha = far ? .7 : .92;
  ctx.fillStyle = mem;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-14, -52); ctx.lineTo(18, -66); ctx.lineTo(46, -46);
  ctx.quadraticCurveTo(36, -34, 30, -22);
  ctx.quadraticCurveTo(22, -26, 16, -12);
  ctx.quadraticCurveTo(8, -18, 2, -4);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = bone; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-14, -52); ctx.lineTo(18, -66); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(18, -66); ctx.lineTo(46, -46); ctx.moveTo(18, -66); ctx.lineTo(30, -22); ctx.moveTo(18, -66); ctx.lineTo(16, -12); ctx.stroke();
  if (L.feat === 'crystal' && !far){ ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.moveTo(4, -40); ctx.lineTo(10, -52); ctx.lineTo(14, -38); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function backFeature(ctx, L, t){
  const pts = [[-20, -12], [-8, -15], [4, -15], [16, -11], [26, -20], [32, -30]];
  pts.forEach(([x, y], i) => {
    if (L.feat === 'leaf'){ ctx.fillStyle = i % 2 ? '#8FD47A' : '#6FBF56'; leaf(ctx, x, y - 2, 9, -1.3 + i * .1); }
    else if (L.feat === 'crystal'){ ctx.fillStyle = i % 2 ? '#EBD4F4' : '#C9A0F0'; ctx.beginPath(); ctx.moveTo(x - 4, y + 2); ctx.lineTo(x, y - 12); ctx.lineTo(x + 4, y + 2); ctx.closePath(); ctx.fill(); }
    else if (L.feat === 'fin'){ if (i === 1 || i === 2){ ctx.fillStyle = L.mem; ctx.beginPath(); ctx.moveTo(x - 10, y + 2); ctx.quadraticCurveTo(x, y - 20, x + 10, y + 2); ctx.closePath(); ctx.fill(); } }
    else if (L.feat === 'flame'){ ctx.fillStyle = i % 2 ? '#FFB02E' : '#FF7A3D'; ctx.beginPath(); ctx.moveTo(x - 4, y + 2); ctx.quadraticCurveTo(x + Math.sin(t * 8 + i) * 3, y - 14, x + 4, y + 2); ctx.closePath(); ctx.fill(); }
    else if (L.feat === 'bolt'){ ctx.fillStyle = '#FFD23F'; ctx.beginPath(); ctx.moveTo(x - 3, y + 2); ctx.lineTo(x + 1, y - 8); ctx.lineTo(x + 4, y + 2); ctx.closePath(); ctx.fill(); }
    else if (L.feat === 'dawn'){ ctx.fillStyle = DAWN[i % 5]; ctx.beginPath(); ctx.moveTo(x - 3, y + 2); ctx.lineTo(x, y - 7); ctx.lineTo(x + 3, y + 2); ctx.closePath(); ctx.fill(); }
    else { ctx.fillStyle = shade(L.body, -.25); ctx.beginPath(); ctx.moveTo(x - 3, y + 2); ctx.lineTo(x, y - 8); ctx.lineTo(x + 3, y + 2); ctx.closePath(); ctx.fill(); }
  });
}
function tailTip(ctx, L, x, y, t){
  if (L.feat === 'flame'){ for (let i = 0; i < 3; i++){ ctx.fillStyle = ['#FF7A3D', '#FFB02E', '#FFF1A8'][i]; ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.quadraticCurveTo(x - 10 - i * 2 + Math.sin(t * 10 + i) * 3, y - 14 + i * 4, x + 6 - i * 2, y - 2 + i * 2); ctx.closePath(); ctx.fill(); } }
  else if (L.feat === 'fin'){ ctx.fillStyle = L.mem; ctx.beginPath(); ctx.moveTo(x + 6, y); ctx.lineTo(x - 10, y - 12); ctx.lineTo(x - 6, y + 10); ctx.closePath(); ctx.fill(); }
  else if (L.feat === 'leaf'){ ctx.fillStyle = '#6FBF56'; leaf(ctx, x, y, 12, -2.6); }
  else if (L.feat === 'crystal'){ ctx.fillStyle = '#EBD4F4'; ctx.beginPath(); ctx.moveTo(x + 4, y + 2); ctx.lineTo(x - 12, y - 6); ctx.lineTo(x + 2, y - 8); ctx.closePath(); ctx.fill(); }
  else if (L.feat === 'bolt'){ ctx.strokeStyle = '#FFD23F'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 4, y); ctx.lineTo(x - 4, y - 8); ctx.lineTo(x + 2, y - 8); ctx.lineTo(x - 8, y - 18); ctx.stroke(); }
  else if (L.feat === 'dawn'){ ctx.fillStyle = '#FFF4D6'; star(ctx, x - 2, y - 2, 5); }
}
function leaf(ctx, x, y, s, rot){ ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(s * .6, -s * .5, s, 0); ctx.quadraticCurveTo(s * .6, s * .5, 0, 0); ctx.fill(); ctx.restore(); }
function star(ctx, x, y, r){ ctx.beginPath(); for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
function roundRectPath(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* ---------- dragon head portrait ---------- */
function drawDragonHead(ctx, cx, cy, size, L, t, evil){
  ctx.save(); ctx.translate(cx - size * .08, cy + size * .18);
  const s = size / 60; ctx.scale(s, s);

  ctx.beginPath(); ctx.moveTo(18, 10); ctx.quadraticCurveTo(30, -14, 34, -34); ctx.lineTo(48, -26); ctx.quadraticCurveTo(42, 0, 34, 14); ctx.closePath(); ctx.fill();

  ctx.fillStyle = L.body; ctx.beginPath(); ctx.ellipse(0, 0, 16, 13, -.1, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14, 4, 13, 8.5, .08, 0, 7); ctx.fill();
  ctx.fillStyle = L.belly; ctx.beginPath(); ctx.ellipse(15, 9, 10, 3.6, .08, 0, 7); ctx.fill();
  ctx.fillStyle = L.horn;
  ctx.beginPath(); ctx.moveTo(-8, -8); ctx.quadraticCurveTo(-18, -16, -24, -24); ctx.quadraticCurveTo(-12, -16, -2, -11); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-2, -11); ctx.quadraticCurveTo(-8, -20, -10, -28); ctx.quadraticCurveTo(0, -18, 4, -12); ctx.closePath(); ctx.fill();
  if (L.feat === 'leaf'){ ctx.fillStyle = '#8FD47A'; leaf(ctx, -10, -16, 9, -2.2); }
  if (L.feat === 'fin'){ ctx.fillStyle = L.mem; ctx.beginPath(); ctx.moveTo(-14, -4); ctx.lineTo(-26, -10); ctx.lineTo(-22, 2); ctx.closePath(); ctx.fill(); }
  if (L.feat === 'bolt'){ ctx.strokeStyle = L.horn; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(-12, -22); ctx.lineTo(-6, -22); ctx.lineTo(-14, -34); ctx.stroke(); }
  if (L.feat === 'dawn'){ ctx.fillStyle = '#FFF4D6'; star(ctx, 2, -6, 3.5); }
  if (evil){ ctx.fillStyle = L.eye; ctx.shadowColor = L.eye; ctx.shadowBlur = 8; ctx.beginPath(); ctx.ellipse(3, -3, 5, 3.4, -.2, 0, 7); ctx.fill(); ctx.shadowBlur = 0; }
  else { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(3, -3, 5.2, 5.4, 0, 0, 7); ctx.fill(); ctx.fillStyle = L.eye; ctx.beginPath(); ctx.arc(4.6, -2.6, 3, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5.6, -4, 1.1, 0, 7); ctx.fill(); }

  ctx.restore();

/* ---------- kids ---------- */
const KID_LOOK = {
  hajun: { top: '#3D6FD8', topDark: '#2A4FA3', legs: '#2E3346', hair: '#2A211C', shoes: '#F2F2F2' },
  hana:  { top: '#FFC23D', topDark: '#D99A1C', legs: '#E8607A', hair: '#4A2E22', shoes: '#FFFFFF' },

function drawKid(ctx, x, y, s, who, dir, phase){
  // x,y = feet center; s = height in px
  const K = KID_LOOK[who], u = s / 40;
  ctx.save(); ctx.translate(x, y); ctx.scale(u, u);
  ctx.fillStyle = 'rgba(10,10,30,.25)'; ctx.beginPath(); ctx.ellipse(0, 0, 9, 3, 0, 0, 7); ctx.fill();

  ctx.fillStyle = K.legs;
  roundRectPath(ctx, -6, -12 + Math.max(0, step), 5, 11 - Math.max(0, step), 2); ctx.fill();
  roundRectPath(ctx, 1, -12 + Math.max(0, -step), 5, 11 - Math.max(0, -step), 2); ctx.fill();
  ctx.fillStyle = K.shoes; ctx.fillRect(-7, -2 - Math.max(0, step) * .4, 6, 2.6); ctx.fillRect(1, -2 - Math.max(0, -step) * .4, 6, 2.6);
  // body
  ctx.fillStyle = K.top; roundRectPath(ctx, -8, -24, 16, 14, 5); ctx.fill();
  ctx.fillStyle = K.topDark;
  if (who === 'hajun'){ ctx.fillRect(-1, -22, 2, 10); ctx.beginPath(); ctx.arc(0, -24, 6, Math.PI, 0); ctx.fill(); }
  else { ctx.fillStyle = '#E8607A'; ctx.fillRect(-7, -24, 14, 3); }
  // arms
  ctx.fillStyle = K.top;
  ctx.save(); ctx.translate(-8, -22); ctx.rotate(.2 + step * .05); roundRectPath(ctx, -3, 0, 4, 11, 2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(8, -22); ctx.rotate(-.2 - step * .05); roundRectPath(ctx, -1, 0, 4, 11, 2); ctx.fill(); ctx.restore();
  if (who === 'hana' && dir !== 'up'){ ctx.fillStyle = '#7FD3FF'; ctx.save(); ctx.translate(9, -14); ctx.rotate(-.6); ctx.fillRect(0, -1, 9, 2.4); ctx.restore(); }
  // head
  ctx.fillStyle = '#F2C9A0'; ctx.beginPath(); ctx.arc(0, -33, 10, 0, 7); ctx.fill();
  ctx.fillStyle = K.hair;
  if (who === 'hajun'){

  easy:   { name: '아기용', sub: '쉬움 · 7세 이상', dmg: .6, hp: 1, enc: .6, gauge: 1.5, penalty: false, smart: false, desc: '적이 약하고, 져도 잃는 게 없어요.' },
  normal: { name: '날개용', sub: '보통 · 10세 이상', dmg: 1, hp: 1, enc: 1, gauge: 1, penalty: true, smart: false, desc: '알맞은 긴장감. 지면 코인 절반을 잃어요.' },
  hard:   { name: '하늘용', sub: '어려움', dmg: 1.35, hp: 1.2, enc: 1.25, gauge: .8, penalty: true, smart: true, desc: '적이 강하고 약한 용을 노려요.' },
};
const SAVE_KEY = 'wow-save-v1';
let G = null;            // saved game state
const S = {               // runtime
  mode: 'title', busy: false, t: 0, map: null, mapCanvas: null, mapTS: 0,
  px: 0, py: 0, moving: null, held: null, trail: [], amb: [], lastSpringKey: null, toastTimer: 0, flash: 0,
};

function hasBatchim(w){ const c = w.charCodeAt(w.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; }
function josa(w, a, b){ return w + (hasBatchim(w) ? a : b); }
function fmt(s){
  if (!G) return s;
  return s.replace(/\{(L|O)(?:([^}\/]*)\/([^}]*))?\}/g, (m, w, a, b) => {
    const n = KO[w === 'L' ? G.leader : G.other];
    return a !== undefined ? josa(n, a, b) : n;
  });
}

function newState(leader, diff){
  return { v: 1, leader, other: leader === 'hajun' ? 'hana' : 'hajun', diff, flags: {}, party: {}, active: [], items: { berry: 3, cookie: 1 },
    coins: 30, map: 'home', x: 10, y: 14, dir: 'up', time: 0, chests: {}, scales: 0, spring: null, stats: { battles: 0, steps: 0, wins: 0 } };
}
function save(){ if (G) store.set(SAVE_KEY, G); }
function loadSave(){ const s = store.get(SAVE_KEY, null); return s && s.v === 1 ? s : null; }

function joinDragon(id, lv){
  const st = statsFor(id, lv);
  G.party[id] = { lv, xp: 0, hp: st.maxhp, ep: 3 };
  if (G.active.length < 3) G.active.push(id);
}
function owned(){ return ORDER.filter(id => G.party[id]); }
function learned(id){ return DRAGONS[id].skills.filter(s => s.lv <= G.party[id].lv); }
function healAll(){ for (const id of owned()){ const p = G.party[id]; p.hp = statsFor(id, p.lv).maxhp; p.ep = 3; } }
function avgLevel(){ const a = owned(); return a.length ? Math.round(a.reduce((s, id) => s + G.party[id].lv, 0) / a.length) : 1; }

/* ---------- canvas sizing ---------- */
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = cv.clientWidth; VH = cv.clientHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  const nts = clamp(Math.floor(Math.min(VW / 9.2, VH / 12.5)), 36, 72);
  if (nts !== TS){ TS = nts; S.mapCanvas = null; S.px = G ? G.x * TS : 0; S.py = G ? G.y * TS : 0; }
}
window.addEventListener('resize', resize);

/* ---------- UI helpers ---------- */
function toast(msg, ms = 2200){
  const el = $('toast'); el.textContent = msg; el.hidden = false; el.style.opacity = 1;
  clearTimeout(S.toastTimer); S.toastTimer = setTimeout(() => { el.style.opacity = 0; setTimeout(() => { el.hidden = true; }, 300); }, TIME.fast ? 0 : ms);
}
async function fade(on){ $('fade').classList.toggle('on', on); await sleep(380); }
function setFieldUI(on){ $('hud').hidden = !on; $('pad').hidden = !on; $('aBtn').hidden = !on; }
function updateHUD(){
  if (!G) return;
  const m = S.map; let name = '';
  if (m.id === 'home') name = '프롤로그 · 뒷산'; else if (m.id === 'hub') name = '평화의 둥지'; else name = REGIONS[m.id].title + (G.flags['clear_' + m.id] ? ' ✓' : '');
  $('locName').textContent = name;
  const cols = ['#5DBB4C', '#36B7E8', '#FF7A3D', '#B48CFF', '#FFD23F'];
  [...$('scaleIcons').children].forEach((el, i) => { el.style.background = i < G.scales ? cols[i] : '#3A4270'; el.style.boxShadow = i < G.scales ? '0 0 8px ' + cols[i] : 'none'; });
}

/* ---------- portraits ---------- */
function speakerInfo(who){
  const R = S.map && REGIONS[S.map.id];
  switch (who){
    case 'L': return { name: KO[G.leader], kid: G.leader };
    case 'O': return { name: KO[G.other], kid: G.other };
    case 'sol': return { name: '솔', look: LOOKS.sol };
    case 'partner': return R && R.partner ? { name: DRAGONS[R.partner].name, look: LOOKS[R.partner] } : { name: '' };
    case 'villager': return R && R.villager ? { name: R.villager.name, look: villagerLook(R) } : { name: '' };
    case 'boss': { const bid = (R && R.boss) || S.bossId; const b = BOSSES[bid]; return { name: b.name, look: b.look, evil: !(G.flags['clear_' + (R ? R.boss : '')] || S.bossCalm) }; }
    case 'orwin': return { name: '오르윈', look: LOOKS.orwin };
    case 'toby': return { name: '토비', raccoon: true };
    default: if (DRAGONS[who]) return { name: DRAGONS[who].name, look: LOOKS[DRAGONS[who].look] }; return { name: '', narr: true };
  }
}
function villagerLook(R){ const L = LOOKS[R.partner]; return Object.assign({}, L, { body: shade(L.body, -.15), wing: shade(L.wing, -.15) }); }
function drawPortrait(c, info, t = 0){
  const g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height);
  const s = c.width;
  const bg = g.createLinearGradient(0, 0, 0, s); bg.addColorStop(0, '#2C3566'); bg.addColorStop(1, '#1A2042');
  g.fillStyle = bg; g.fillRect(0, 0, s, s);
  if (info.kid) drawKidPortrait(g, s / 2, s * .56, s * .95, info.kid, info.mood);
  else if (info.look) drawDragonHead(g, s * .44, s * .56, s * .62, info.look, t, info.evil);
  else if (info.raccoon) drawRaccoon(g, s / 2, s * .98, s * 1.1, t);
}

/* ---------- dialogue ---------- */
const DLG = { resolve: null, full: '', shown: 0, timer: null, typing: false };
function say(lines){
  return (async () => {
    for (const ln of lines){
      const [who, text] = ln;
      await sayOne(who, fmt(text));
    }
  })();
}
function sayOne(who, text){
  return new Promise(res => {
    const info = speakerInfo(who);
    $('dlg').hidden = false; setFieldUI(false);
    $('dlgBox').classList.toggle('noPortrait', !!info.narr);
    $('dlgPortrait').hidden = !!info.narr;
    if (!info.narr) drawPortrait($('dlgPortrait'), info, S.t);
    $('dlgName').textContent = info.narr ? '' : info.name;
    $('dlgText').style.fontStyle = info.narr ? 'italic' : 'normal';
    $('dlgChoices').innerHTML = '';
    DLG.full = text; DLG.shown = 0; DLG.typing = true; $('dlgMore').hidden = true;
    DLG.resolve = res;
    if (TIME.fast || S.autoDialog){ $('dlgText').textContent = text; DLG.typing = false; DLG.resolve = null; res(); return; }
    $('dlgText').textContent = '';
    clearInterval(DLG.timer);
    DLG.timer = setInterval(() => {
      DLG.shown = Math.min(DLG.full.length, DLG.shown + 1);
      $('dlgText').textContent = DLG.full.slice(0, DLG.shown);
      if (DLG.shown % 3 === 0 && DLG.full[DLG.shown - 1] !== ' ') AudioSys.sfx('blip', who === 'L' || who === 'O' ? 760 : 520);
      if (DLG.shown >= DLG.full.length){ clearInterval(DLG.timer); DLG.typing = false; $('dlgMore').hidden = false; }
    }, 32);
  });
}
function dlgAdvance(){
  if ($('dlg').hidden || !DLG.resolve) return;
  if (DLG.typing){ clearInterval(DLG.timer); DLG.typing = false; $('dlgText').textContent = DLG.full; $('dlgMore').hidden = false; return; }
  const r = DLG.resolve; DLG.resolve = null; AudioSys.sfx('select'); r();
}
function closeDialog(){ $('dlg').hidden = true; if (S.mode === 'field' && !S.busy) setFieldUI(true); }
function ask(who, text, options){
  return new Promise(res => {
    const info = speakerInfo(who);
    $('dlg').hidden = false; setFieldUI(false);
    $('dlgBox').classList.toggle('noPortrait', !!info.narr); $('dlgPortrait').hidden = !!info.narr;
    if (!info.narr) drawPortrait($('dlgPortrait'), info, S.t);
    $('dlgName').textContent = info.narr ? '' : info.name; $('dlgText').textContent = fmt(text); $('dlgMore').hidden = true;
    const box = $('dlgChoices'); box.innerHTML = '';
    DLG.resolve = null;
    if (TIME.fast || S.autoDialog){ res(0); return; }
    options.forEach((o, i) => { const b = document.createElement('button'); b.className = 'btn' + (i === 0 ? ' gold' : ''); b.textContent = o; b.onclick = () => { AudioSys.sfx('confirm'); box.innerHTML = ''; res(i); }; box.appendChild(b); });
  });
}
$('dlg').addEventListener('pointerup', e => { if (e.target.closest('button')) return; dlgAdvance(); });

/* ---------- map handling ---------- */
function tileAt(m, x, y){ if (x < 0 || y < 0 || x >= m.w || y >= m.h) return '#'; const c = m.rows[y][x]; return c === '@' ? '.' : c; }
function objAt(m, x, y){ return m.objs.find(o => o.x === x && o.y === y && !objGone(o)); }
function objGone(o){ return (o.type === 'boss' && G.flags['clear_' + S.map.id]) || (o.type === 'egg' && G.flags.sol) || (o.type === 'npc' && o.id === 'partner' && G.flags['clear_' + S.map.id]); }
function exitAt(m, x, y){ return m.exits.find(e => e.x === x && e.y === y); }
function walkable(m, x, y){
  const c = tileAt(m, x, y);
  if (!'.,=*E'.includes(c)) return false;
  const o = objAt(m, x, y); if (o && o.type !== 'spring') return false;
  return true;
}
async function enterMap(id, x, y, opts = {}){
  S.busy = true;
  if (!opts.noFade) await fade(true);
  const m = getMap(id);
  S.map = m; S.mapCanvas = null; G.map = id;
  const st = x == null ? m.start : [x, y];
  G.x = st[0]; G.y = st[1];
  S.px = G.x * TS; S.py = G.y * TS; S.moving = null;
  { // followers start behind the leader when there is room
    const back = { up: [0, 1], down: [0, -1], left: [1, 0], right: [-1, 0] }[G.dir] || [0, 1];
    const p1 = walkable(m, G.x + back[0], G.y + back[1]) ? [G.x + back[0], G.y + back[1]] : [G.x, G.y];
    const p2 = walkable(m, p1[0] + back[0], p1[1] + back[1]) ? [p1[0] + back[0], p1[1] + back[1]] : p1;
    S.trail = [[G.x, G.y], p1, p2, p2];
  }
  S.amb = []; S.lastSpringKey = id + ':' + G.x + ',' + G.y;
  S.mode = 'field';
  updateHUD();
  const T = THEMES[m.theme];
  AudioSys.play(T.music);
  save();
  if (!opts.noFade) await fade(false);
  S.busy = false;
  setFieldUI(true);
  await onEnterMap(m);
}

/* ---------- field input ---------- */
const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const keyDir = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
const heldKeys = [];
window.addEventListener('keydown', e => {
  AudioSys.init();
  if (keyDir[e.code]){ if (!heldKeys.includes(keyDir[e.code])) heldKeys.push(keyDir[e.code]); e.preventDefault(); }
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyZ'){
    e.preventDefault();
    if (!$('dlg').hidden && DLG.resolve){ dlgAdvance(); return; }
    if (S.mode === 'field' && !S.busy) actionA();
  }
  if ((e.code === 'Escape' || e.code === 'KeyM') && S.mode === 'field' && !S.busy) openMenu();
});
window.addEventListener('keyup', e => { if (keyDir[e.code]){ const i = heldKeys.indexOf(keyDir[e.code]); if (i >= 0) heldKeys.splice(i, 1); } });
let padDir = null;
$('pad').addEventListener('pointerdown', e => { const b = e.target.closest('button'); if (!b) return; AudioSys.init(); padDir = b.dataset.d; b.classList.add('on'); try { $('pad').setPointerCapture(e.pointerId); } catch(_){} e.preventDefault(); });
$('pad').addEventListener('pointermove', e => {
  if (!padDir) return;
  const r = $('pad').getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  if (Math.hypot(dx, dy) < 14) return;
  const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  if (d !== padDir){ padDir = d; [...$('pad').children].forEach(b => b.classList.toggle('on', b.dataset.d === d)); }
});
const padUp = () => { padDir = null; [...$('pad').children].forEach(b => b.classList.remove('on')); };
$('pad').addEventListener('pointerup', padUp); $('pad').addEventListener('pointercancel', padUp);
$('aBtn').addEventListener('click', () => { AudioSys.init(); if (S.mode === 'field' && !S.busy) actionA(); });
$('menuBtn').addEventListener('click', () => { if (S.mode === 'field' && !S.busy) openMenu(); });
cv.addEventListener('pointerdown', e => {
  AudioSys.init();
  if (S.mode === 'battle') return battleCanvasTap(e);
  if (!$('dlg').hidden && DLG.resolve){ dlgAdvance(); }
});
function currentDir(){ return padDir || heldKeys[heldKeys.length - 1] || null; }

function facingTile(){ const [dx, dy] = DIRV[G.dir]; return [G.x + dx, G.y + dy]; }
async function actionA(){
  const [fx, fy] = facingTile();
  const o = objAt(S.map, fx, fy);
  if (o && o.type !== 'spring'){ S.busy = true; setFieldUI(false); try { await interact(o); } finally { closeDialog(); S.busy = false; if (S.mode === 'field') setFieldUI(true); } return; }
  const ex = exitAt(S.map, fx, fy);
  if (ex && ex.req && !G.flags[ex.req]){ toast(ex.locked); AudioSys.sfx('bump'); }
}

function tryMove(dir){
  G.dir = dir;
  const [dx, dy] = DIRV[dir], nx = G.x + dx, ny = G.y + dy;
  const ex = exitAt(S.map, nx, ny);
  if (ex && ex.req && !G.flags[ex.req]){ if (S.lastBump !== nx + ',' + ny){ toast(ex.locked); AudioSys.sfx('bump'); S.lastBump = nx + ',' + ny; } return; }
  if (!walkable(S.map, nx, ny)) return;
  S.lastBump = null;
  S.trail.unshift([nx, ny]); S.trail.length = 4;
  S.moving = { fx: G.x, fy: G.y, tx: nx, ty: ny, t: 0, dur: .17 };
  G.x = nx; G.y = ny;
}
async function arrive(){
  G.stats.steps++;
  const m = S.map;
  const ex = exitAt(m, G.x, G.y);
  if (ex){ AudioSys.sfx('door'); S.busy = true; setFieldUI(false); await enterMap(ex.to, ex.tx, ex.ty); return; }
  const o = objAt(m, G.x, G.y);
  const k = m.id + ':' + G.x + ',' + G.y;
  if (o && o.type === 'spring'){ if (S.lastSpringKey !== k){ S.lastSpringKey = k; healAll(); G.spring = { map: m.id, x: G.x, y: G.y }; save(); AudioSys.sfx('spring'); toast('빛의 샘: 모두 기운을 되찾았다! (자동 저장)'); } return; }
  S.lastSpringKey = null;
  // boss / first meeting with the partner dragon trigger automatically when you step next to them
  for (const ob of m.objs){
    const near = Math.abs(ob.x - G.x) + Math.abs(ob.y - G.y) === 1;
    const auto = ob.type === 'boss' || (ob.type === 'npc' && ob.id === 'partner' && !G.flags['p_' + m.id]);
    if (auto && near && !objGone(ob)){
      S.busy = true; setFieldUI(false);
      try { await interact(ob); } finally { closeDialog(); S.busy = false; if (S.mode === 'field') setFieldUI(true); }
      return;
    }
  }
  if (tileAt(m, G.x, G.y) === ',' && m.enc && (!m.enc.req || G.flags[m.enc.req])){
    if (Math.random() < m.enc.rate * DIFF[G.diff].enc){
      S.busy = true; setFieldUI(false);
      try { await randomBattle(); } finally { S.busy = false; if (S.mode === 'field') setFieldUI(true); }
    }
  }
}

/* ---------- field update & render ---------- */
function updateField(dt){
  if (S.moving){
    const mv = S.moving; mv.t += dt;
    const k = Math.min(1, mv.t / mv.dur);
    S.px = lerp(mv.fx, mv.tx, k) * TS; S.py = lerp(mv.fy, mv.ty, k) * TS;
    if (k >= 1){ S.moving = null; S.px = G.x * TS; S.py = G.y * TS; arrive(); }
  } else if (!S.busy && $('dlg').hidden && $('menu').hidden && $('shop').hidden){
    const d = currentDir(); if (d) tryMove(d);
  }
  // ambient particles
  const T = THEMES[S.map.theme];
  while (S.amb.length < 36) S.amb.push(newAmb(T.fx, true));
  for (const p of S.amb){ p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.ph += dt; }
  S.amb = S.amb.filter(p => p.life > 0 && p.y > -40 && p.y < VH + 40 && p.x > -40 && p.x < VW + 40);
  if (T.fx === 'rain' && Math.random() < dt * .08) S.flash = .6;
  S.flash = Math.max(0, S.flash - dt * 2);
}
function newAmb(fx, anywhere){
  const p = { x: rand(0, VW), y: anywhere ? rand(0, VH) : -10, vx: 0, vy: 0, life: rand(4, 9), ph: rand(0, 6), fx };
  switch (fx){
    case 'leaves': p.vx = rand(-20, 10); p.vy = rand(20, 40); p.c = pick(['#D9541E', '#E8A23C', '#B83A1E']); break;
    case 'motes': p.vy = rand(-12, -4); p.vx = rand(-5, 5); p.c = 'rgba(255,255,255,.8)'; break;
    case 'spores': p.vy = rand(-14, -6); p.vx = rand(-6, 6); p.c = 'rgba(190,255,150,.8)'; break;
    case 'bubbles': p.vy = rand(-20, -10); p.vx = rand(-4, 4); p.c = 'rgba(255,255,255,.6)'; break;
    case 'ash': p.vy = rand(14, 30); p.vx = rand(-10, 10); p.c = Math.random() < .3 ? '#FF9A3D' : 'rgba(190,180,180,.7)'; break;
    case 'glints': p.vy = rand(-4, 4); p.vx = rand(-4, 4); p.c = '#FFF2D8'; break;
    case 'rain': p.vy = rand(420, 520); p.vx = -80; p.y = rand(-VH, VH); p.c = 'rgba(190,210,255,.45)'; p.life = 2; break;
    case 'voidmotes': p.vy = rand(-16, -6); p.vx = rand(-6, 6); p.c = 'rgba(200,160,255,.85)'; break;
  }
  return p;
}
function renderField(){
  const m = S.map, T = THEMES[m.theme];
  if (!S.mapCanvas || S.mapTS !== TS){ S.mapCanvas = renderStaticMap(m, TS); S.mapTS = TS; }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = T.liqA; ctx.fillRect(0, 0, VW, VH);
  const mw = m.w * TS, mh = m.h * TS;
  let camX = S.px + TS / 2 - VW / 2, camY = S.py + TS / 2 - VH / 2;
  camX = mw <= VW ? (mw - VW) / 2 : clamp(camX, 0, mw - VW);
  camY = mh <= VH ? (mh - VH) / 2 : clamp(camY, -TS * .5, mh - VH + TS * 2.6);
  const ox = Math.round(-camX), oy = Math.round(-camY);
  ctx.drawImage(S.mapCanvas, ox, oy);
  // animated liquid
  const x0 = Math.max(0, Math.floor(camX / TS)), x1 = Math.min(m.w - 1, Math.ceil((camX + VW) / TS));
  const y0 = Math.max(0, Math.floor(camY / TS)), y1 = Math.min(m.h - 1, Math.ceil((camY + VH) / TS));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (m.rows[y][x] === '~') drawLiquidAnim(ctx, T, ox + x * TS, oy + y * TS, TS, S.t, x, y);
  // entities sorted by y
  const ents = [];
  for (const o of m.objs){ if (objGone(o)) continue; ents.push({ y: o.y, draw: () => drawObj(o, ox + o.x * TS + TS / 2, oy + o.y * TS + TS) }); }
  for (const e of m.exits) ents.push({ y: e.y - .01, draw: () => drawGate(ctx, ox + e.x * TS + TS / 2, oy + e.y * TS + TS * .98, TS, !e.req || G.flags[e.req], S.t, e.to === 'rift' ? 'rgba(160,110,255,.6)' : null) });
  // party caravan
  const k = S.moving ? Math.min(1, S.moving.t / S.moving.dur) : 1;
  const tr = S.trail;
  const follow = (i) => { const a = tr[i + 1] || tr[i], b = tr[i] || a; return [lerp(a[0], b[0], k), lerp(a[1], b[1], k)]; };
  const walking = !!S.moving;
  const ph = S.t * 12;
  const lead = G.active.find(id => G.party[id]) || (G.flags.sol ? 'sol' : null);
  if (lead){ const [fx, fy] = follow(2); const dirR = fx <= S.px / TS ? 1 : -1; ents.push({ y: fy - .02, draw: () => drawDragon(ctx, ox + fx * TS + TS / 2, oy + fy * TS + TS * .55, TS * .5, LOOKS[DRAGONS[lead].look], S.t, { face: dirR, fast: walking, seed: 3 }) }); }
  { const [fx, fy] = follow(1); const d = G.dir; ents.push({ y: fy - .01, draw: () => drawKid(ctx, ox + fx * TS + TS / 2, oy + fy * TS + TS * .92, TS * 1.02, G.other, d, walking ? ph + 1.5 : 0) }); }
  ents.push({ y: S.py / TS, draw: () => drawKid(ctx, ox + S.px + TS / 2, oy + S.py + TS * .92, TS * 1.06, G.leader, G.dir, walking ? ph : 0) });
  ents.sort((a, b) => a.y - b.y).forEach(e => e.draw());
  // tint + ambient
  if (T.tint && !G.flags['clear_' + m.id]){ ctx.fillStyle = T.tint; ctx.fillRect(0, 0, VW, VH); }
  for (const p of S.amb){
    ctx.fillStyle = p.c; ctx.strokeStyle = p.c;

    else if (p.fx === 'rain'){ ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 4, p.y + 14); ctx.stroke(); }
    else if (p.fx === 'bubbles'){ ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.stroke(); }

  }

function drawObj(o, x, y){

const B = { on: false, allies: [], enemies: [], gauge: 0, fx: [], texts: [], shake: 0, flash: 0, theme: 'home', boss: null, canRun: true,
  resolver: null, cur: null, targeting: null, auto: false, result: null, phase: 0, tutorial: false };

function makeAllyUnit(id){

function makeEnemyUnit(kind, lv, boss){

  return { side: 'enemy', kind, boss: !!boss, name: def.name, el: def.el, lv, maxhp: Math.round(st.maxhp * hpM), hp: Math.round(st.maxhp * hpM), atk: st.atk, def: st.def, spd: st.spd,
    buffs: { atk: 0, guard: 0, stun: 0 }, guardRound: false, off: { x: 0, y: 0 }, flashT: 0, x: 0, y: 0, size: 60, moves: boss ? def.moves : null, look: boss ? def.look : null, special: def.special, acted: false, extraAct: false, atkMul: 1 };
}
const alive = u => u.hp > 0;

function pickBattleAllies(){
  const ids = [...G.active, ...owned().filter(id => !G.active.includes(id))];
  const up = ids.filter(id => G.party[id].hp > 0), down = G.active.filter(id => G.party[id].hp <= 0);

async function startBattle(opt){
  B.on = true; B.result = null; B.fx = []; B.texts = []; B.gauge = opt.gauge || 0; B.shake = 0; B.flash = 0; B.phase = 1;
  B.theme = opt.theme || S.map.theme; B.boss = opt.boss || null; B.canRun = opt.canRun !== false; B.tutorial = !!opt.tutorial; B.targeting = null; B.cur = null;
  B.cleared = G.flags['clear_' + (S.map && S.map.id)];
  B.allies = pickBattleAllies().map(makeAllyUnit);
  B.enemies = opt.enemies.map(e => makeEnemyUnit(e.kind, e.lv, e.boss));
  G.stats.battles++;
  AudioSys.sfx(opt.boss ? 'roar' : 'encounter');
  AudioSys.play(opt.music || (opt.boss ? (opt.boss === 'morg' ? 'final' : 'boss') : 'battle'));
  if (!TIME.fast){ S.flash = 1; await sleep(260); }
  await fade(true);
  S.mode = 'battle'; setFieldUI(false); $('dlg').hidden = true; $('bui').hidden = false;
  renderAllies(); renderKids(); setCmds([]);
  layoutBattle();
  await fade(false);
  const names = B.enemies.map(e => e.name);
  await blog(opt.intro || (B.boss ? `${josa(B.enemies[0].name, '이', '가')} 앞을 막아섰다!` : `${josa([...new Set(names)].join(', '), '이', '가')} 나타났다!`), 900);
  if (B.tutorial) await blog('용마다 행동을 고른 뒤, 아이 버튼이 빛나면 눌러 보세요!', 1400);

  while (!B.result){
    const plan = await playerPhase();
    if (plan === 'run'){
      if (Math.random() < .8){ AudioSys.sfx('miss'); await blog('무사히 도망쳤다!', 700); B.result = 'run'; break; }
      await blog('도망치지 못했다!', 700);
      await runRound(new Map());
    } else await runRound(plan);
  }
  return await finishBattle();
}

/* ---------- layout & render ---------- */
function battleFieldH(){ const h = $('bui').offsetHeight || VH * .4; return Math.max(VH * .45, VH - h + 30); }
function layoutBattle(){
  const fh = battleFieldH();
  B.groundY = fh * .5;
  const n = B.enemies.length, hasBoss = B.enemies.some(e => e.boss);
  const slots = [[.9, .22], [.9, .46], [.4, .2]]; let si = 0;
  B.enemies.forEach((e, i) => {
    if (e.boss){ e.size = Math.min(VW * .3, fh * .36); e.x = VW * (hasBoss && n > 1 ? .62 : .68); e.y = fh * .34; }
    else if (hasBoss){ const sl = slots[si++ % 3]; e.size = Math.min(VW * .15, fh * .18); e.x = VW * sl[0]; e.y = fh * sl[1]; }
    else {
      const xs = n === 1 ? [.72] : n === 2 ? [.6, .84] : [.54, .7, .87], ys = n === 1 ? [.34] : n === 2 ? [.3, .38] : [.36, .27, .4];
      e.size = Math.min(VW * .19, fh * .24); e.x = VW * xs[i]; e.y = fh * ys[i];
    }
  });
  const xs = [.2, .42, .64], ys = [.7, .58, .74];
  B.allies.forEach((a, i) => { a.size = Math.min(VW * .17, fh * .2); a.x = VW * xs[i] - (B.allies.length === 1 ? -VW * .1 : 0); a.y = fh * ys[i]; });
}
function renderBattle(dt){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sx = B.shake ? rand(-B.shake, B.shake) : 0, sy = B.shake ? rand(-B.shake, B.shake) : 0;
  B.shake = Math.max(0, B.shake - dt * 40);
  ctx.save(); ctx.translate(sx, sy);
  drawBattleBG(ctx, B.theme, VW, VH, S.t, B.groundY || VH * .3, B.cleared);
  const fh = battleFieldH();
  // enemies
  for (const e of B.enemies){
    if (e.hp <= 0 && e.fade == null) e.fade = 1;
    if (e.fade != null){ e.fade -= dt * 2; if (e.fade <= 0) continue; ctx.globalAlpha = Math.max(0, e.fade); }
    const x = e.x + e.off.x, y = e.y + e.off.y;
    if (e.boss) drawDragon(ctx, x, y, e.size, e.look, S.t, { face: -1, big: true, elder: e.kind !== 'morg', evil: true, aura: e.kind === 'morg' ? 'rgba(255,90,215,.28)' : 'rgba(120,60,200,.3)' });
    else drawEnemy(ctx, e.kind, x, y, e.size, S.t, null);
    if (e.flashT > 0){ ctx.globalAlpha = Math.min(1, e.flashT * 3) * .6; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, e.size * .55, 0, 7); ctx.fill(); ctx.globalAlpha = 1; e.flashT -= dt; }
    ctx.globalAlpha = 1;
    if (e.hp > 0){
      const bw = Math.max(70, e.size * .9), bx = e.x - bw / 2, by = e.y - e.size * (e.boss ? .78 : .62);
      ctx.fillStyle = 'rgba(14,17,38,.8)'; roundRectPath(ctx, bx - 4, by - 18, bw + 8, 28, 8); ctx.fill();
      ctx.fillStyle = '#F4EFE2'; ctx.font = `${Math.max(11, Math.round(VW * .028))}px Jua, sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(`${e.name}  Lv${e.lv}`, bx, by - 3, bw);
      ctx.fillStyle = '#0E1128'; ctx.fillRect(bx, by + 1, bw, 6);
      ctx.fillStyle = e.hp / e.maxhp > .5 ? '#7DDB6A' : e.hp / e.maxhp > .25 ? '#FFB547' : '#FF6B57'; ctx.fillRect(bx, by + 1, bw * e.hp / e.maxhp, 6);
      ctx.fillStyle = EL[e.el].color; ctx.beginPath(); ctx.arc(bx + bw + 9, by + 4, 5, 0, 7); ctx.fill();
      if (e.buffs.stun > 0) stunStars(e.x, by - 26);
      if (B.targeting === 'enemy'){ ctx.fillStyle = '#FFB547'; const ay = by - 30 + Math.sin(S.t * 6) * 4; ctx.beginPath(); ctx.moveTo(e.x - 9, ay - 10); ctx.lineTo(e.x + 9, ay - 10); ctx.lineTo(e.x, ay); ctx.closePath(); ctx.fill(); }
    }
  }
  // allies
  for (const a of B.allies){
    const x = a.x + a.off.x, y = a.y + a.off.y;
    if (a.hp <= 0){ ctx.globalAlpha = .45; drawDragon(ctx, x, y + a.size * .12, a.size, a.look, 0, { face: 1, still: true }); ctx.globalAlpha = 1; continue; }
    drawDragon(ctx, x, y, a.size, a.look, S.t + a.x, { face: 1, seed: a.x });
    if (a.flashT > 0){ ctx.globalAlpha = Math.min(1, a.flashT * 3) * .55; ctx.fillStyle = '#FF6B57'; ctx.beginPath(); ctx.arc(x, y, a.size * .55, 0, 7); ctx.fill(); ctx.globalAlpha = 1; a.flashT -= dt; }
    if (a.buffs.stun > 0) stunStars(x, y - a.size * .7);
    if (a.buffs.guard > 0 || a.guardRound){ ctx.strokeStyle = 'rgba(127,211,255,.7)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, a.size * .62, 0, 7); ctx.stroke(); }
    if (a.buffs.atk > 0){ ctx.fillStyle = '#FF6B57'; ctx.beginPath(); ctx.moveTo(x - a.size * .5, y - a.size * .55); ctx.lineTo(x - a.size * .42, y - a.size * .7); ctx.lineTo(x - a.size * .34, y - a.size * .55); ctx.fill(); }
    if (B.cur === a){ ctx.fillStyle = '#FFB547'; const ay = y - a.size * .82 + Math.sin(S.t * 6) * 4; ctx.beginPath(); ctx.moveTo(x - 9, ay - 10); ctx.lineTo(x + 9, ay - 10); ctx.lineTo(x, ay); ctx.closePath(); ctx.fill(); }
    if (B.targeting === 'ally' || (B.targeting === 'fainted' && a.hp <= 0)){ ctx.strokeStyle = '#FFB547'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.arc(x, y, a.size * .7, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
  }
  // effects
  for (const p of B.fx){
    p.t += dt; const k = p.t / p.life;
    if (p.kind === 'orb'){
      const e = Math.min(1, k); const x = lerp(p.x0, p.x1, e), y = lerp(p.y0, p.y1, e) - Math.sin(e * Math.PI) * 30;
      ctx.fillStyle = p.c; ctx.shadowColor = p.c; ctx.shadowBlur = 16; ctx.beginPath(); ctx.arc(x, y, p.r, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
      for (let i = 1; i < 5; i++){ const e2 = Math.max(0, e - i * .05); ctx.globalAlpha = .5 - i * .1; ctx.beginPath(); ctx.arc(lerp(p.x0, p.x1, e2), lerp(p.y0, p.y1, e2) - Math.sin(e2 * Math.PI) * 30, p.r * (1 - i * .15), 0, 7); ctx.fill(); }
      ctx.globalAlpha = 1;
    } else if (p.kind === 'spark'){
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
      ctx.globalAlpha = Math.max(0, 1 - k); ctx.fillStyle = p.c;
      if (p.star) star(ctx, p.x, p.y, p.r); else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
      ctx.globalAlpha = 1;
    } else if (p.kind === 'ring'){
      ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = p.c; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (.3 + k), 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (p.kind === 'bolt'){
      ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = p.c; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(p.x, p.y - 160); let yy = p.y - 160, xx = p.x;
      while (yy < p.y){ yy += 24; xx = p.x + rand(-16, 16); ctx.lineTo(xx, yy); } ctx.stroke(); ctx.globalAlpha = 1;
    } else if (p.kind === 'kid'){
      const e = k < .2 ? k / .2 : k > .8 ? (1 - k) / .2 : 1;
      const pw = Math.min(VW * .5, 260);
      ctx.globalAlpha = e; ctx.fillStyle = 'rgba(14,17,38,.85)'; roundRectPath(ctx, VW / 2 - pw / 2, fh * .25, pw, pw * .62, 18); ctx.fill();
      drawKidPortrait(ctx, VW / 2 - pw * .22, fh * .25 + pw * .36, pw * .5, p.who, 'happy');
      ctx.fillStyle = '#FFB547'; ctx.font = `${Math.round(pw * .085)}px Jua, sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(KO[p.who] + '!', VW / 2 + pw * .02, fh * .25 + pw * .22, pw * .46);
      ctx.fillStyle = '#F4EFE2'; ctx.font = `${Math.round(pw * .07)}px Jua, sans-serif`; ctx.fillText(p.name, VW / 2 + pw * .02, fh * .25 + pw * .38, pw * .46);
      ctx.globalAlpha = 1;
    }
  }
  B.fx = B.fx.filter(p => p.t < p.life);
  for (const tx of B.texts){
    tx.t += dt; const k = tx.t / tx.life;
    ctx.globalAlpha = k > .7 ? (1 - k) / .3 : 1;
    ctx.font = `${tx.big ? Math.round(Math.max(24, VW * .06)) : Math.round(Math.max(16, VW * .042))}px Jua, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(14,17,38,.9)'; ctx.strokeText(tx.txt, tx.x, tx.y - k * 40);
    ctx.fillStyle = tx.c; ctx.fillText(tx.txt, tx.x, tx.y - k * 40);
    ctx.globalAlpha = 1;

  B.texts = B.texts.filter(t => t.t < t.life);
  ctx.restore();
  if (B.flash > 0){ ctx.fillStyle = `rgba(255,255,255,${B.flash})`; ctx.fillRect(0, 0, VW, VH); B.flash = Math.max(0, B.flash - dt * 3); }
}
function stunStars(x, y){ ctx.fillStyle = '#FFE14A'; for (let i = 0; i < 3; i++){ const a = S.t * 4 + i * 2.1; star(ctx, x + Math.cos(a) * 16, y + Math.sin(a) * 5, 5); } }
function floatText(u, txt, c, big){ B.texts.push({ x: u.x + rand(-10, 10), y: u.y - u.size * .35, txt, c, big, t: 0, life: 1.1 }); }

async function tween(u, dx, dy, ms){

/* ---------- player phase ---------- */
async function playerPhase(){
  const plan = new Map();
  const order = B.allies.filter(a => alive(a) && a.buffs.stun <= 0);
  if (!order.length) return plan;
  let i = 0;
  while (i < order.length){
    const a = order[i]; B.cur = a; renderAllies();
    if (B.auto || S.autoBattle){
      B.choosing = false; renderKids();
      const k = aiKid(); if (k){ await useKid(k.who, k.skill); if (B.result) return plan; }
      plan.set(a, aiChoose(a)); i++;
      continue;
    }
    B.choosing = true; renderKids();
    const ch = await chooseFor(a, i);
    B.choosing = false; renderKids();
    if (B.result) return plan;
    if (ch.kidDone){ renderAllies(); continue; }
    if (ch.back){ i = Math.max(0, i - 1); plan.delete(order[i]); continue; }
    if (ch.run) return 'run';
    if (ch.auto){ B.auto = true; continue; }
    plan.set(a, ch); i++;
  }
  B.cur = null; B.resolver = null; setCmds([]); renderAllies();
  return plan;
}
async function chooseFor(a, idx){
  for (;;){
    const first = idx === 0;
    setCmds([
      { label: '공격', el: a.el, v: { t: 'attack' }, gold: true },
      { label: '기술', v: { t: 'skill' } },
      { label: '방어', v: { t: 'defend' } },
      { label: '가방', v: { t: 'item' } },
      first ? (B.canRun ? { label: '도망', v: { t: 'run' } } : { blank: true }) : { label: '뒤로', v: { t: 'back' }, back: true },
      { label: '자동', sub: '알아서', v: { t: 'auto' } },
    ]);
    $('blog').textContent = `${josa(a.name, '은', '는')} 무엇을 할까?`;
    const p = await waitPick();
    if (p.t === 'kid'){ if (await kidFlow(p.who)) return { kidDone: true }; continue; }
    if (p.t === 'attack'){ const tg = await pickTarget('enemy'); if (!tg) continue; return { type: 'attack', target: tg }; }
    if (p.t === 'defend') return { type: 'defend' };
    if (p.t === 'run') return { run: true };
    if (p.t === 'back') return { back: true };
    if (p.t === 'auto') return { auto: true };
    if (p.t === 'skill'){
      const sks = learned(a.id);
      setCmds([...sks.map(s => ({ label: s.n, sub: `★${s.ep}`, el: s.el, disabled: a.ep < s.ep, v: { t: 'sk', s } })), { label: '뒤로', v: { t: 'back' }, back: true }]);
      $('blog').textContent = sks.map(s => `${s.n}: ${skillDesc(s)}`).join('  ·  ');
      const q = await waitPick();
      if (q.t === 'kid'){ if (await kidFlow(q.who)) return { kidDone: true }; continue; }
      if (q.t !== 'sk') continue;
      const s = q.s;
      let tg = null;
      if (s.tgt === 'one'){ tg = await pickTarget('enemy'); if (!tg) continue; }
      if (s.tgt === 'ally'){ tg = await pickTarget('ally'); if (!tg) continue; }
      return { type: 'skill', skill: s, target: tg };
    }
    if (p.t === 'item'){
      const keys = Object.keys(ITEMS).filter(k => G.items[k] > 0);
      setCmds([...keys.map(k => ({ label: ITEMS[k].name, sub: '×' + G.items[k], v: { t: 'it', k } })), { label: '뒤로', v: { t: 'back' }, back: true }]);
      $('blog').textContent = keys.length ? '무엇을 쓸까?' : '가방이 비었어요.';
      const q = await waitPick();
      if (q.t !== 'it') continue;
      const tg = await pickTarget(ITEMS[q.k].use === 'revive' ? 'fainted' : 'ally');
      if (!tg) continue;
      return { type: 'item', key: q.k, target: tg };
    }
  }
}
function skillDesc(s){
  if (s.type === 'heal') return '한 용 회복'; if (s.type === 'healAll') return '모두 회복'; if (s.type === 'shield') return '모두 받는 피해 감소';
  if (s.type === 'rage') return '자기 공격력 상승'; if (s.type === 'stun') return '적 하나를 멈춤';
  return (s.tgt === 'all' ? '적 전체 ' : '') + EL[s.el].name + ' 공격';
}
async function pickTarget(kind){

  if (!pool.length){ await blog(kind === 'fainted' ? '기절한 용이 없어요.' : '대상이 없어요.', 600); return null; }
  if (pool.length === 1 && kind === 'enemy') return pool[0];
  B.targeting = kind;
  setCmds([...pool.map(u => ({ label: u.name, sub: kind === 'enemy' ? `${Math.round(u.hp / u.maxhp * 100)}%` : `${u.hp}/${u.maxhp}`, el: u.el, v: { t: 'target', u } })), { label: '뒤로', v: { t: 'back' }, back: true }]);
  $('blog').textContent = kind === 'enemy' ? '누구를 노릴까? (화면을 눌러도 돼요)' : '누구에게 쓸까?';
  const p = await waitPick();

}
async function kidFlow(who){

async function useKid(who, sk){

  B.choosing = false; renderKids(); setCmds([]);
  B.fx.push({ kind: 'kid', who, name: sk.n, t: 0, life: TIME.fast ? .01 : 1.3 });

  if (sk.id === 'shield'){ B.allies.filter(alive).forEach(a => { a.buffs.guard = 2; B.fx.push({ kind: 'ring', x: a.x, y: a.y, r: a.size, c: '#7FD3FF', t: 0, life: .7 }); }); await blog('든든한 방패! 받는 피해가 절반이 된다!'); }
  if (sk.id === 'song'){

    await blog('치유의 노래가 울려 퍼진다!');
  }

    AudioSys.sfx('stun'); await blog('반짝 피리 소리에 적들이 멈칫했다!');

/* ---------- AI ---------- */
function aiChoose(a){
  const foes = B.enemies.filter(alive), friends = B.allies.filter(alive);
  const sks = learned(a.id).filter(s => s.ep <= a.ep);
  const low = friends.filter(f => f.hp / f.maxhp < .4).sort((x, y) => x.hp / x.maxhp - y.hp / y.maxhp)[0];
  const heal = sks.find(s => s.type === 'heal' || s.type === 'healAll');
  if (low && heal) return { type: 'skill', skill: heal, target: heal.tgt === 'ally' ? low : null };
  let best = null, score = 0;
  const atkScore = Math.max(...foes.map(f => elMult(a.el, f.el)));
  for (const s of sks.filter(s => s.el)){
    if (s.tgt === 'all'){ const sc = foes.length > 1 ? s.pow * foes.reduce((t, f) => t + elMult(s.el, f.el), 0) : 0; if (sc > score){ score = sc; best = { type: 'skill', skill: s, target: null }; } }
    else for (const f of foes){ const sc = s.pow * elMult(s.el, f.el) * (f.boss ? 1.2 : 1); if (sc > score){ score = sc; best = { type: 'skill', skill: s, target: f }; } }
  }
  const boss = foes.some(f => f.boss);
  const sup = sks.find(s => (s.type === 'shield' && boss && !friends.some(f => f.buffs.guard > 0)) || (s.type === 'rage' && boss && a.buffs.atk <= 0) || (s.type === 'stun' && boss));
  if (sup && Math.random() < .5) return { type: 'skill', skill: sup, target: sup.tgt === 'one' ? foes.find(f => f.boss) : null };
  if (best && score >= atkScore * 1.25 && (a.ep >= 4 || boss || foes.length > 1 || score >= 3)) return best;
  const tgt = foes.slice().sort((x, y) => (elMult(a.el, y.el) - elMult(a.el, x.el)) || (x.hp - y.hp))[0];
  return { type: 'attack', target: tgt };
}
function aiKid(){
  const friends = B.allies.filter(alive), lowAvg = B.allies.reduce((t, f) => t + f.hp / f.maxhp, 0) / B.allies.length;
  const healer = KID_SKILLS.hana[0], courage = KID_SKILLS.hajun[0];
  if (B.gauge >= kidCost('hana') && (lowAvg < .5 || friends.length < B.allies.length)) return { who: 'hana', skill: healer };
  const boss = B.enemies.some(e => alive(e) && e.boss);
  if (B.gauge >= kidCost('hajun') && (boss || B.enemies.filter(alive).length > 1 || B.gauge >= 100)) return { who: 'hajun', skill: G.scales >= 3 && boss && Math.random() < .4 ? KID_SKILLS.hajun[1] : courage };
  return null;
}

/* ---------- round execution ---------- */
function idleCmds(){
  if (B.auto && !S.autoBattle){ setCmds([{ label: '자동 끄기', sub: '다음 차례부터', v: { t: 'autooff' }, gold: true }]); B.resolver = () => { B.auto = false; setCmds([]); }; }
  else setCmds([]);
}
async function runRound(plan){
  B.cur = null; idleCmds(); renderAllies();
  const acts = [];
  for (const [a, ch] of plan) acts.push(Object.assign({ actor: a, spd: a.spd * rand(1, 1.1), prio: ch.type === 'defend' ? 1 : 0 }, ch));
  for (const e of B.enemies.filter(alive)) { acts.push({ actor: e, type: 'enemy', spd: e.spd * rand(1, 1.1), prio: 0 }); if (e.extraAct) acts.push({ actor: e, type: 'enemy', spd: e.spd * .6, prio: 0 }); }
  acts.sort((x, y) => (y.prio - x.prio) || (y.spd - x.spd));
  B.allies.concat(B.enemies).forEach(u => u.acted = false);
  for (const act of acts){
    if (B.result) break;
    const u = act.actor; if (!alive(u)) continue;
    if (u.buffs.stun > 0 && act.type !== 'defend'){ await blog(`${josa(u.name, '은', '는')} 몸이 굳어 움직이지 못한다!`, 600); u.acted = true; continue; }
    if (act.type === 'enemy') await enemyAction(u); else await allyAction(u, act);
    u.acted = true;
    renderAllies(); renderKids();
    checkEnd();
  }
  // end of round
  for (const u of B.allies.concat(B.enemies)){
    u.guardRound = false;
    for (const k of ['atk', 'guard', 'stun']) if (u.buffs[k] > 0) u.buffs[k]--;
    if (u.side === 'ally' && alive(u)) u.ep = Math.min(u.maxep, u.ep + 1);
  }
  renderAllies(); renderKids();
}
function checkEnd(){
  if (!B.enemies.some(alive)) B.result = 'win';
  else if (!B.allies.some(alive)) B.result = 'lose';
}
function gainGauge(n){ B.gauge = Math.min(100, B.gauge + n * DIFF[G.diff].gauge); }
function calcDmg(a, d, pow, el){
  const atk = a.atk * (a.buffs.atk > 0 ? 1.5 : 1) * (a.atkMul || 1);
  const mult = elMult(el, d.el);
  let dmg = atk * pow * 1.6 * (60 / (60 + d.def * 2.2)) * mult * rand(.9, 1.1);
  if (d.guardRound) dmg *= .5;
  if (d.buffs.guard > 0) dmg *= d.side === 'enemy' ? .6 : .55;
  if (a.side === 'enemy') dmg *= DIFF[G.diff].dmg;
  const crit = Math.random() < .06;
  if (crit) dmg *= 1.5;
  return { dmg: Math.max(1, Math.round(dmg)), mult, crit };
}
async function hurt(u, r){
  u.hp = Math.max(0, u.hp - r.dmg); u.flashT = .3; B.shake = r.mult > 1 || r.crit ? 9 : 5;
  AudioSys.sfx(r.mult > 1 || r.crit ? 'crit' : r.mult < 1 ? 'weak' : 'hit');
  floatText(u, String(r.dmg), u.side === 'enemy' ? '#FFFFFF' : '#FF8A7A', r.mult > 1 || r.crit);
  if (u.side === 'ally') gainGauge(6);

async function finishBattle(){
  const res = B.result;
  B.targeting = null; B.cur = null; setCmds([]); renderAllies();
  // write back hp/ep
  for (const a of B.allies){ const p = G.party[a.id]; p.hp = a.hp; p.ep = Math.max(a.ep, 2); }
  if (res === 'win'){
    G.stats.wins++;
    AudioSys.play('victory');
    Clips.play('win', { force: true });
    let xp = 0, coins = 0;
    for (const e of B.enemies){ xp += Math.round(6 + e.lv * 4.5) * (e.boss ? 6 : 1); coins += (3 + e.lv * 2) * (e.boss ? 5 : 1); }
    G.coins += coins;
    await blog(`승리! 경험치 ${xp}, 코인 ${coins}개를 얻었다.`, 1100);
    const inBattle = new Set(B.allies.map(a => a.id));
    for (const id of owned()){
      const p = G.party[id];
      const gain = inBattle.has(id) && p.hp > 0 ? xp : Math.round(xp * .5);
      p.xp += gain;
      while (p.xp >= xpNeed(p.lv)){
        p.xp -= xpNeed(p.lv);
        const before = statsFor(id, p.lv); p.lv++; const after = statsFor(id, p.lv);
        if (p.hp > 0) p.hp = Math.min(after.maxhp, p.hp + (after.maxhp - before.maxhp));
        AudioSys.sfx('levelup');
        Clips.play('go');
        const u = B.allies.find(a => a.id === id); if (u){ u.lv = p.lv; burstAt(u, '#FFE08A', 16, true); floatText(u, 'Lv UP!', '#FFE08A', true); renderAllies(); }
        await blog(`${DRAGONS[id].name}의 레벨이 올랐다! (Lv ${p.lv})`, 900);
        const nw = DRAGONS[id].skills.find(s => s.lv === p.lv);
        if (nw) await blog(`${josa(DRAGONS[id].name, '이', '가')} 새 기술 「${nw.n}」${hasBatchim(nw.n) ? '을' : '를'} 배웠다!`, 1100);
      }
    }
  } else if (res === 'lose'){
    AudioSys.sfx('lose'); AudioSys.stop();
    Clips.play('no', { force: true });
    await blog('모두 기절하고 말았다...', 1200);
  }
  await fade(true);
  $('bui').hidden = true; B.on = false; S.mode = 'field';
  if (S.map) AudioSys.play(THEMES[S.map.theme].music);
  return res;
}

async function handleLose(){
  const pen = DIFF[G.diff].penalty;
  healAll();
  const lost = pen ? Math.floor(G.coins / 2) : 0; G.coins -= lost;
  const sp = G.spring || { map: S.map.id, x: S.map.start[0], y: S.map.start[1] };
  await enterMap(sp.map, sp.x, sp.y, { noFade: true });
  await fade(false);
  await say([['L', pen ? `빛의 샘에서 정신을 차렸다... 코인 ${lost}개를 잃어버렸어.` : '빛의 샘에서 정신을 차렸다. 다시 힘을 내 보자!'], ['sol', '괜찮아. 우리 다시 해 보자!']]);
  closeDialog();
}
async function randomBattle(){
  const enc = S.map.enc;
  let n = 1; const r = Math.random();
  if (r < .12) n = 3; else if (r < .45) n = 2;
  if (G.diff === 'easy') n = Math.min(n, 2);
  if (owned().length === 1) n = Math.min(n, 2);
  const enemies = [];
  for (let i = 0; i < n; i++) enemies.push({ kind: pick(enc.pool), lv: irand(enc.lv[0], enc.lv[1]) });
  const res = await startBattle({ enemies });
  if (res === 'lose') return handleLose();
  await fade(false); save();
}
